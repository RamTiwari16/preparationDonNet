<rect x="324" y="372" width="252" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="389.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold" xml:space="preserve">4 of 8 checked</text>
<text x="450.0" y="412.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="450.0" dy="0">click marks Item1 + parents dirty;</tspan><tspan x="450.0" dy="18">clean subtrees are skipped</tspan></text>
<rect x="600" y="56" width="276" height="400" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="616" y="80" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9" font-weight="bold" xml:space="preserve">Signals</text>
<text x="616" y="100" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve">fine-grained: dependents only</text>
<rect x="612" y="112" width="252" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="620" y="134" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve"><tspan>count = </tspan><tspan fill="#6d28d9" font-weight="bold">signal</tspan><tspan>(0);</tspan></text>
<text x="620" y="154" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve"><tspan>dbl = </tspan><tspan fill="#0f766e" font-weight="bold">computed</tspan><tspan>(()=&gt;count()*2);</tspan></text>
<text x="620" y="174" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve"><tspan>count.</tspan><tspan fill="#b91c1c" font-weight="bold">set</tspan><tspan>(1); // notifies</tspan></text>
<rect x="666" y="204" width="144" height="30" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="738.0" y="220.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">count (signal)</text>
<rect x="612" y="262" width="120" height="30" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="672.0" y="278.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve">dbl (computed)</text>
<rect x="744" y="262" width="120" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="804.0" y="278.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">Item1 view</text>
<rect x="612" y="318" width="120" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="672.0" y="334.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">Chart view</text>
<line x1="720" y1="234" x2="672" y2="262" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<line x1="756" y1="234" x2="804" y2="262" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<line x1="672" y1="292" x2="672" y2="318" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<rect x="744" y="318" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="804" y="338" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" xml:space="preserve">Header, Item2 ...</text>
<rect x="612" y="372" width="252" height="72" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="738.0" y="389.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold" xml:space="preserve">Only 2 views refresh</text>
<text x="738.0" y="412.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="738.0" dy="0">views that read count() are marked;</tspan><tspan x="738.0" dy="18">no full tree walk needed</tspan></text>
<rect x="24" y="472" width="420" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="496" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" font-weight="bold" xml:space="preserve">OnPush re-checks a component only when:</text>
<text x="40" y="518" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="40" dy="0">1) an @Input gets a new reference (update immutably)</tspan><tspan x="40" dy="18">2) an event fires in it or in a child</tspan><tspan x="40" dy="18">3) an async pipe or a signal in its template changes,</tspan><tspan x="40" dy="18">    or you call markForCheck()</tspan></text>
<rect x="456" y="472" width="420" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472" y="496" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9" font-weight="bold" xml:space="preserve">Why signals matter</text>
<text x="472" y="518" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="472" dy="0">Default CD walks the tree after every Zone.js task.</tspan><tspan x="472" dy="18">A signal knows exactly which views read it, so</tspan><tspan x="472" dy="18">Angular updates just those views, which enables</tspan><tspan x="472" dy="18">zoneless apps (no Zone.js) in modern Angular.</tspan></text>
<text x="24" y="608" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-style="italic" xml:space="preserve">Interview takeaway: use OnPush + immutable inputs, and signals for fine-grained updates instead of whole-tree checks.</text>
</svg>
