<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" role="img">
<title>Angular Change Detection and Signals</title>
<desc>Which components Angular checks after a click with Default versus OnPush change detection, and how signals update only the views that read them.</desc>
