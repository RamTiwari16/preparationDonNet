<rect x="422" y="286" width="72" height="26" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="458" y="304" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" xml:space="preserve">Item2</text>
<line x1="376" y1="336" x2="376" y2="314" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
