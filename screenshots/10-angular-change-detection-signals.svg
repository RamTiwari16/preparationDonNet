<text x="162.0" y="412.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="162.0" dy="0">Zone.js sees the click and Angular</tspan><tspan x="162.0" dy="18">checks the whole tree, top-down</tspan></text>
