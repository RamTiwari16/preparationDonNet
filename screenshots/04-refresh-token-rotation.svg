<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Refresh Token Rotation and Reuse Detection</title>
<desc>Each refresh call swaps the old refresh token for a new one, and replaying an already used refresh token revokes the whole token family.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="691" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">Refresh Token Rotation and Reuse Detection</text>
<rect x="45.0" y="52" width="170" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="79.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Client (SPA / app)</text>
<line x1="130" y1="96" x2="130" y2="382" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="365.0" y="52" width="170" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="450" y="72.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Auth API</text>
<text x="450" y="88.0" font-size="13" fill="#334155" text-anchor="middle">POST /refresh</text>
<line x1="450" y1="96" x2="450" y2="382" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="675.0" y="52" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="770" y="72.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Database</text>
<text x="770" y="88.0" font-size="13" fill="#334155" text-anchor="middle">refresh_tokens (hashes)</text>
<line x1="770" y1="96" x2="770" y2="382" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="40" y="108" width="270" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="60" cy="130" r="11" fill="#b45309"/>
<text x="60" y="134.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="78" y="125" font-size="13" fill="#1f2937"><tspan x="78" dy="0">Access token (15 min) expired:</tspan><tspan x="78" dy="17">API answered 401 Unauthorized</tspan></text>
<line x1="130" y1="200" x2="450" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="300.0" y="192" font-size="14" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="300.0" dy="0">POST /refresh  { refresh_token: R1 }</tspan></text>
<circle cx="147" cy="200" r="11" fill="#2563eb"/>
<text x="147" y="204.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<line x1="450" y1="258" x2="770" y2="258" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrT)"/>
<text x="610.0" y="234" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="610.0" dy="0">Look up SHA-256(R1):</tspan><tspan x="610.0" dy="16">found, unused, not expired</tspan></text>
<circle cx="467" cy="258" r="11" fill="#0f766e"/>
<text x="467" y="262.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<line x1="450" y1="316" x2="770" y2="316" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrT)"/>
<text x="610.0" y="292" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="610.0" dy="0">Mark R1 used, insert hash(R2)</tspan><tspan x="610.0" dy="16">same family F1, new expiry</tspan></text>
<circle cx="467" cy="316" r="11" fill="#0f766e"/>
<text x="467" y="320.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<line x1="450" y1="370" x2="130" y2="370" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
<text x="280.0" y="346" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="280.0" dy="0">200 OK: NEW access token A2 (15 min)</tspan><tspan x="280.0" dy="16">+ NEW refresh token R2 (R1 is now dead)</tspan></text>
<circle cx="433" cy="370" r="11" fill="#15803d"/>
<text x="433" y="374.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<rect x="600" y="108" width="276" height="50" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="614" y="128" font-size="13" fill="#1f2937"><tspan x="614" dy="0">Store only the hash of each</tspan><tspan x="614" dy="18">refresh token, never the raw value.</tspan></text>
<rect x="24" y="398" width="852" height="232" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="40" y="424" font-size="15" fill="#0f172a" font-weight="700">Token family F1 = one login session</text>
<rect x="40" y="440" width="170" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="125" y="462" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">R1</text>
<text x="125" y="482" font-size="13" fill="#334155" text-anchor="middle">used at 10:00</text>
<rect x="248" y="440" width="170" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="333" y="462" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">R2</text>
<text x="333" y="482" font-size="13" fill="#334155" text-anchor="middle">used at 10:15</text>
<rect x="456" y="440" width="170" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="541" y="462" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">R3</text>
<text x="541" y="482" font-size="13" fill="#334155" text-anchor="middle">active</text>
<line x1="212" y1="467" x2="244" y2="467" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="467" x2="452" y2="467" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="650" y="460" font-size="13" fill="#1f2937"><tspan x="650" dy="0">Single-use: every refresh swaps</tspan><tspan x="650" dy="17">in a NEW token. Only the newest</tspan><tspan x="650" dy="17">token in the family is valid.</tspan></text>
<path d="M40,502 V508 H626 V502" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="40" y="528" font-size="13" fill="#b91c1c" font-weight="700">family_id = F1 on every token</text>
<rect x="40" y="550" width="170" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="125" y="572" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="125" dy="0">Attacker (or stale</tspan><tspan x="125" dy="17">client) replays R1</tspan></text>
<circle cx="228" cy="576" r="11" fill="#dc2626"/>
<text x="228" y="580.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<line x1="240" y1="576" x2="262" y2="576" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
<rect x="266" y="550" width="270" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="401" y="572" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="401" dy="0">hash(R1) found but already used:</tspan><tspan x="401" dy="17">REUSE DETECTED</tspan></text>
<circle cx="554" cy="576" r="11" fill="#dc2626"/>
<text x="554" y="580.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<line x1="566" y1="576" x2="588" y2="576" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
<rect x="592" y="550" width="272" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="728" y="572" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="728" dy="0">Revoke the WHOLE family: R1, R2, R3</tspan><tspan x="728" dy="17">→ 401, user must sign in again</tspan></text>
<line x1="610" y1="550" x2="610" y2="510" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
<text x="24" y="668" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">rotate on every use, hash tokens at rest, and treat reuse of an old refresh token as theft by revoking the family.</tspan></text>
</svg>
