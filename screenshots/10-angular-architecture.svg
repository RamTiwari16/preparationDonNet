<text x="48" y="342" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve"><tspan>  {{ p.price </tspan><tspan fill="#92400e" font-weight="bold">| currency</tspan><tspan> }}</tspan></text>
