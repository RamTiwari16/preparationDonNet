<text x="160.0" y="469.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve">Styles: scoped to this component</text>
<rect x="332" y="64" width="272" height="164" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="348" y="88" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">Dependency Injection (DI)</text>
<text x="348" y="110" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="348" dy="0">The injector builds dependencies</tspan><tspan x="348" dy="18">and hands them to whoever asks:</tspan></text>
<text x="348" y="152" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve">constructor(private svc: Svc)</text>
<text x="348" y="176" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="348" dy="0">providedIn: 'root' = one shared</tspan><tspan x="348" dy="18">singleton for the whole app;</tspan><tspan x="348" dy="18">component providers: one each</tspan></text>
<rect x="332" y="256" width="272" height="80" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="468.0" y="278.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold" xml:space="preserve">Service (@Injectable)</text>
<text x="468.0" y="301.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="468.0" dy="0">business logic, shared state,</tspan><tspan x="468.0" dy="18">returns Observables / signals</tspan></text>
