<rect x="24" y="64" width="272" height="68" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="160.0" y="80.3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold" xml:space="preserve">Router</text>
