<text x="656" y="110" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="656" dy="0">No NgModule: a component lists</tspan><tspan x="656" dy="18">its own imports: [ ... ].</tspan><tspan x="656" dy="18">Default since Angular 17.</tspan><tspan x="656" dy="18">app.config.ts registers</tspan><tspan x="656" dy="18">provideRouter(routes),</tspan><tspan x="656" dy="18">provideHttpClient(...)</tspan></text>
