<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img">
<title>Angular Building Blocks</title>
<desc>How a routed Angular component uses dependency-injected services, HttpClient and interceptors to call an ASP.NET Core API.</desc>
