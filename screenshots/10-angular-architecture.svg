<text x="758" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" xml:space="preserve">(server, over HTTPS + JSON)</text>
<text x="660" y="332" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="660" dy="0">Controllers / Minimal APIs</tspan><tspan x="660" dy="20">JWT bearer authentication</tspan><tspan x="660" dy="20">CORS: allow the SPA origin</tspan><tspan x="660" dy="20">EF Core -&gt; Azure SQL</tspan><tspan x="660" dy="20">returns JSON + status codes</tspan></text>
