<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" role="img">
<title>Value vs Reference Types in C#</title>
<desc>Stack versus heap: int locals are copied, two class references share one heap object, and boxing copies a value into a heap object.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="621" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Value vs Reference Types in C#</text>
<!-- panels -->
<rect x="32" y="88" width="380" height="476" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<rect x="488" y="88" width="380" height="476" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#334155" font-weight="700">STACK  (locals, fast, per call)</text>
<text x="508" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#334155" font-weight="700">HEAP  (objects, garbage collected)</text>
<circle cx="58" cy="141" r="11" fill="#2563eb"/>
<text x="58" y="146" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="146" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="700">Value type: assignment copies the data</text>
<text x="52" y="170" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">int a = 5;  int b = a;  b = 9;</text>
<rect x="52" y="182" width="140" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="66" y="205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">a</text>
<text x="178" y="205" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#1e3a8a" text-anchor="end">5</text>
<rect x="208" y="182" width="140" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="222" y="205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">b</text>
<text x="334" y="205" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#1e3a8a" text-anchor="end">9</text>
<text x="52" y="242" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">b got its own copy - changing b leaves a at 5</text>
<rect x="508" y="176" width="340" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="678" y="199" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="678" dy="0">No heap object involved: the value</tspan><tspan x="678" dy="18">lives inline in the stack frame</tspan></text>
<line x1="52" y1="256" x2="392" y2="256" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="508" y1="256" x2="848" y2="256" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="58" cy="281" r="11" fill="#0f766e"/>
<text x="58" y="286" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="286" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="700">Reference type: assignment copies the pointer</text>
<text x="52" y="310" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">var o1 = new Order();  var o2 = o1;</text>
<rect x="52" y="322" width="140" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="66" y="345" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#134e4a" font-weight="700">o1</text>
<text x="178" y="345" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#134e4a" text-anchor="end">0x1A40</text>
<rect x="52" y="376" width="140" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="66" y="399" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#134e4a" font-weight="700">o2</text>
<text x="178" y="399" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#134e4a" text-anchor="end">0x1A40</text>
<rect x="520" y="316" width="316" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="540" y="344" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">Order object  @ 0x1A40</text>
<text x="540" y="368" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#14532d">Status = "Shipped"</text>
<text x="540" y="392" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d">set via o2.Status, visible via o1</text>
<path d="M192 340 L518 340" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrT)"/>
<path d="M192 394 L518 394" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrT)"/>
<text x="262" y="372" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#134e4a" font-weight="600">two refs, ONE object</text>
<line x1="52" y1="436" x2="392" y2="436" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="508" y1="436" x2="848" y2="436" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="58" cy="461" r="11" fill="#b45309"/>
<text x="58" y="466" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="466" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="700">Boxing: a value type turned into object</text>
<text x="52" y="490" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">object x = 42;   // boxing</text>
<rect x="52" y="500" width="140" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="66" y="523" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">x</text>
<text x="178" y="523" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#78350f" text-anchor="end">0x2C10</text>
<rect x="520" y="496" width="316" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="540" y="523" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="600">boxed Int32 = 42  (heap copy)</text>
<path d="M192 518 L518 518" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrA)"/>
<text x="52" y="554" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600">allocates + copies; unboxing casts back: avoid in hot loops</text>
<text x="32" y="598" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: assignment copies the variable - for a struct that is the data, for a class it is only the reference.</text>
</svg>
