<text x="574.0" y="119.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold" xml:space="preserve">Code quality</text>
<text x="574.0" y="142.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="574.0" dy="0">analyzers,</tspan><tspan x="574.0" dy="18">Sonar, SAST</tspan></text>
