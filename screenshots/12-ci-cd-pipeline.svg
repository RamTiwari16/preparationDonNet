<text x="24" y="36" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold" xml:space="preserve">CI/CD Pipeline for a .NET App</text>
<rect x="24" y="100" width="108" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="78.0" y="119.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold" xml:space="preserve">Developer</text>
