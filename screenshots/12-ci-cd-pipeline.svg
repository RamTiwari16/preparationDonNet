<text x="202.0" y="142.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="202.0" dy="0">PR / merge</tspan><tspan x="202.0" dy="18">triggers run</tspan></text>
