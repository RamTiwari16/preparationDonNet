<text x="32" y="596" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: declare the narrowest interface you need (IEnumerable&lt;T&gt; in, List&lt;T&gt; internally) and know each Big-O.</text>
