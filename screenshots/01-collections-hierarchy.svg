<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img">
<title>C# Collections Interface Hierarchy</title>
<desc>Interface hierarchy from IEnumerable of T down to IList, ISet and IDictionary, with the common concrete collections and their typical Big-O costs.</desc>
