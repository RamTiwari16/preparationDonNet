<text x="826" y="442.98" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="826" dy="0" font-weight="bold">Status</tspan><tspan x="826" dy="17">sent, failed</tspan></text>
<rect x="24" y="412" width="300" height="128" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="38" y="435.68" font-size="13" fill="#1f2937"><tspan x="38" dy="0" font-weight="bold">Design notes</tspan><tspan x="38" dy="18">- Idempotency key: no duplicate sends</tspan><tspan x="38" dy="18">- Priority lanes: OTP before marketing</tspan><tspan x="38" dy="18">- Rate limits per user and per provider</tspan><tspan x="38" dy="18">- Quiet hours and unsubscribe respected</tspan><tspan x="38" dy="18">- A slow SMS gateway never blocks email</tspan></text>
<text x="32" y="584" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: queue per channel isolates failures; retries need backoff + jitter, and poison messages belong in a DLQ.</text>
</g>
