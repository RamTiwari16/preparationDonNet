<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" role="img">
<title>Notification Service Design</title>
<desc>Notification service: API, preference check and templating, one queue and worker pool per channel, providers, retries with backoff, dead-letter queue and delivery status store.</desc>
