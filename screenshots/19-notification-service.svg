<rect x="0.5" y="0.5" width="899" height="603" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<text x="32" y="40" font-size="20" fill="#0f172a" font-weight="bold">Notification Service Design</text>
<text x="32" y="62" font-size="13.5" fill="#475569">Accept fast, fan out per channel, retry with backoff, park poison messages, record every delivery.</text>
<rect x="24" y="216" width="116" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
