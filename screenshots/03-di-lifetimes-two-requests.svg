<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img">
<title>DI Lifetimes Across Two Requests</title>
<desc>Which instance each consumer receives for Singleton, Scoped and Transient registrations across two HTTP requests, each with a controller and a service injecting the dependency.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrSR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">DI Lifetimes Across Two Requests</text>
<text x="32" y="68" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">In each request, OrderController and PricingService both inject the same dependency type</text>
<rect x="200" y="84" width="328" height="352" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="364" y="108" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">HTTP Request 1  =  DI scope 1</text>
<text x="286" y="132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">OrderController</text>
<text x="442" y="132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">PricingService</text>
<rect x="540" y="84" width="328" height="352" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="704" y="108" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">HTTP Request 2  =  DI scope 2</text>
<text x="626" y="132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">OrderController</text>
<text x="782" y="132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">PricingService</text>
<rect x="32" y="148" width="152" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="48" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#14532d" font-weight="700">Singleton</text>
<text x="48" y="194" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">AddSingleton</text>
<text x="48" y="214" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">one per app</text>
<rect x="32" y="244" width="152" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700">Scoped</text>
<text x="48" y="290" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">AddScoped</text>
<text x="48" y="310" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">one per request</text>
<rect x="32" y="340" width="152" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="48" y="366" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" font-weight="700">Transient</text>
<text x="48" y="386" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155">AddTransient</text>
<text x="48" y="406" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">new every injection</text>
<rect x="216" y="160" width="636" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="534.0" y="184" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#14532d" font-weight="700" text-anchor="middle">#A</text>
<text x="534.0" y="204" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">the same object in every request until the app shuts down (must be thread-safe)</text>
<rect x="216" y="256" width="296" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="364.0" y="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="middle">#B1</text>
<text x="364.0" y="300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">shared by both consumers in request 1</text>
<rect x="556" y="256" width="296" height="56" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
<text x="704.0" y="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="middle">#B2</text>
<text x="704.0" y="300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">fresh for request 2, disposed at its end</text>
<rect x="216" y="352" width="140" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="286.0" y="376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" font-weight="700" text-anchor="middle">#C1</text>
<text x="286.0" y="396" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">new instance</text>
<rect x="372" y="352" width="140" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="442.0" y="376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" font-weight="700" text-anchor="middle">#C2</text>
<text x="442.0" y="396" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">new instance</text>
<rect x="556" y="352" width="140" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="626.0" y="376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" font-weight="700" text-anchor="middle">#C3</text>
<text x="626.0" y="396" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">new instance</text>
<rect x="712" y="352" width="140" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="782.0" y="376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" font-weight="700" text-anchor="middle">#C4</text>
<text x="782.0" y="396" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">new instance</text>
<rect x="32" y="452" width="836" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="48" y="474" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="48" dy="0">Gotcha: a longer-lived service must not hold a shorter-lived one (Singleton -&gt; Scoped = captive dependency).</tspan><tspan x="48" dy="20">Scoped and transient IDisposable instances are disposed when their scope (the request) ends.</tspan></text>
<text x="32" y="536" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: Singleton = one per app, Scoped = one per request, Transient = one per injection.</text>
</svg>
