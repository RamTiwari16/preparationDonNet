<text x="40" y="454" font-size="14" fill="#0f172a" font-weight="700">The FK always lives on the dependent side</text>
<text x="40" y="476" font-size="13" fill="#1f2937"><tspan x="40" dy="0">Order.CustomerId, OrderItem.OrderId and OrderItem.ProductId point at the principal's PK (the “many” side holds the FK).</tspan><tspan x="40" dy="19">1 : 1  ShippingAddress.OrderId is both PK and FK, so an order can have at most one address.</tspan><tspan x="40" dy="19">N : N  ProductTag has a composite PK (ProductId, TagId); EF Core 5+ can create it from skip navigations.</tspan></text>
<text x="40" y="540" font-size="13" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" xml:space="preserve">modelBuilder.Entity&lt;Order&gt;().HasOne(o =&gt; o.Customer).WithMany(c =&gt; c.Orders).HasForeignKey(o =&gt; o.CustomerId);</text>
<text x="24" y="584" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">find the dependent (the side holding the FK) first; cardinality and cascade delete follow from it.</tspan></text>
</svg>
