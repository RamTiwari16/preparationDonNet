<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img">
<title>Cache-Aside Pattern Flow</title>
<desc>Read path (hit and miss) and write path of cache-aside between a client, an API, Redis and SQL Server.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<text x="32" y="40" font-size="20" fill="#0f172a" font-weight="bold">Cache-Aside Pattern Flow</text>
<text x="32" y="62" font-size="13.5" fill="#475569">The application owns the cache: look aside first, load from the DB on a miss, invalidate on write.</text>
<rect x="24" y="96" width="104" height="144" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="76" y="164.04" font-size="14" fill="#1f2937" text-anchor="middle"><tspan x="76" dy="0" font-weight="bold">Client</tspan><tspan x="76" dy="18">web / mobile</tspan></text>
<rect x="280" y="96" width="168" height="144" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="364" y="164.04" font-size="14" fill="#1f2937" text-anchor="middle"><tspan x="364" dy="0" font-weight="bold">ASP.NET Core API</tspan><tspan x="364" dy="18">GetProduct(42)</tspan></text>
<rect x="664" y="96" width="196" height="144" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="762" y="155.04" font-size="14" fill="#1f2937" text-anchor="middle"><tspan x="762" dy="0" font-weight="bold">Redis cache</tspan><tspan x="762" dy="18">key: product:42</tspan><tspan x="762" dy="18">value: JSON, TTL 300 s</tspan></text>
<path d="M280,313 L280,391 A84,9 0 0 0 448,391 L448,313 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<ellipse cx="364" cy="313" rx="84" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="364" y="351.64" font-size="14" fill="#1f2937" text-anchor="middle"><tspan x="364" dy="0" font-weight="bold">SQL Server</tspan><tspan x="364" dy="18">Products table</tspan></text>
<polyline points="128,128 280,128" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_blue)"/>
<circle cx="146" cy="128" r="11" fill="#2563eb"/>
<text x="146" y="132.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="212" y="119" font-size="13" fill="#334155" text-anchor="middle">GET /products/42</text>
<polyline points="280,168 128,168" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_green)"/>
<circle cx="262" cy="168" r="11" fill="#15803d"/>
<text x="262" y="172.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="190" y="159" font-size="13" fill="#14532d" text-anchor="middle">200 OK  ~1 ms</text>
<polyline points="280,208 128,208" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_amber)"/>
<circle cx="262" cy="208" r="11" fill="#b45309"/>
<text x="262" y="212.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<text x="190" y="199" font-size="13" fill="#78350f" text-anchor="middle">200 OK  ~30 ms</text>
<polyline points="448,128 664,128" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_blue)"/>
<circle cx="466" cy="128" r="11" fill="#2563eb"/>
<text x="466" y="132.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="560" y="119" font-size="13" fill="#334155" text-anchor="middle">GET product:42</text>
<polyline points="664,168 448,168" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_blue)"/>
<circle cx="646" cy="168" r="11" fill="#2563eb"/>
<text x="646" y="172.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="552" y="159" font-size="13" fill="#334155" text-anchor="middle">HIT: value  |  MISS: nil</text>
<polyline points="448,208 664,208" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_amber)"/>
<circle cx="466" cy="208" r="11" fill="#b45309"/>
<text x="466" y="212.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="562" y="199" font-size="13" fill="#78350f" text-anchor="middle">SET + TTL (with jitter)</text>
<polyline points="330,240 330,304" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_amber)"/>
<circle cx="330" cy="272" r="11" fill="#b45309"/>
<text x="330" y="276.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="316" y="276" font-size="13" fill="#78350f" text-anchor="end">SELECT ... Id = 42</text>
<polyline points="398,304 398,240" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_amber)"/>
<circle cx="398" cy="272" r="11" fill="#b45309"/>
<text x="398" y="276.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="414" y="276" font-size="13" fill="#78350f">row</text>
<rect x="24" y="264" width="120" height="24" rx="12.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="84" y="280.68" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">Hit: 1-2-3-4</text>
<rect x="24" y="296" width="156" height="24" rx="12.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="102" y="312.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="bold">Miss: 1-2-3-5-6-7-8</text>
<rect x="512" y="272" width="348" height="128" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="528" y="309.18" font-size="13" fill="#1f2937"><tspan x="528" dy="0" font-weight="bold">Gotchas</tspan><tspan x="528" dy="21">- TTL bounds staleness; add jitter to expiry</tspan><tspan x="528" dy="21">- Update race: a stale value can be re-cached</tspan><tspan x="528" dy="21">- Redis down? fall back to SQL, do not fail</tspan></text>
<rect x="24" y="416" width="852" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="40" y="440" font-size="14" fill="#4c1d95" font-weight="bold">Write path: update the database first, then invalidate the key</text>
<rect x="40" y="456" width="166" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="123" y="476.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="123" dy="0" font-weight="bold">PUT /products/42</tspan><tspan x="123" dy="17">new price from client</tspan></text>
<circle cx="42" cy="456" r="11" fill="#7c3aed"/>
<text x="42" y="460.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<polyline points="206,480 258,480" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_purple)"/>
<rect x="258" y="456" width="166" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="341" y="476.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="341" dy="0" font-weight="bold">UPDATE SQL Server</tspan><tspan x="341" dy="17">commit the change first</tspan></text>
<circle cx="260" cy="456" r="11" fill="#7c3aed"/>
<text x="260" y="460.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<polyline points="424,480 476,480" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_purple)"/>
<rect x="476" y="456" width="166" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="559" y="476.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="559" dy="0" font-weight="bold">DEL product:42</tspan><tspan x="559" dy="17">invalidate, do not patch</tspan></text>
<circle cx="478" cy="456" r="11" fill="#7c3aed"/>
<text x="478" y="460.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<polyline points="642,480 694,480" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_purple)"/>
<rect x="694" y="456" width="166" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="777" y="476.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="777" dy="0" font-weight="bold">Next GET = miss</tspan><tspan x="777" dy="17">reloads the fresh row</tspan></text>
<circle cx="696" cy="456" r="11" fill="#7c3aed"/>
<text x="696" y="460.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="32" y="542" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: read = cache, else DB then populate with TTL; write = update DB then delete the key (never trust cache alone).</text>
</g>
</svg>
