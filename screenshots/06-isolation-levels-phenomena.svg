<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>SQL Server Isolation Levels vs Read Phenomena</title>
<desc>Matrix of the six SQL Server isolation levels against dirty, non-repeatable and phantom reads, with whether each level uses locks or row versions in tempdb.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="595" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">SQL Server Isolation Levels vs Read Phenomena</text>
<rect x="24" y="56" width="852" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="38" y="86" font-size="14" fill="#0f172a" font-weight="700">Isolation level</text>
<text x="297.0" y="77" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Dirty read</text>
<text x="297.0" y="94" font-size="13" fill="#475569" text-anchor="middle">uncommitted data</text>
<text x="431.0" y="77" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Non-repeatable</text>
<text x="431.0" y="94" font-size="13" fill="#475569" text-anchor="middle">row changed on re-read</text>
<text x="571.0" y="77" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Phantom read</text>
<text x="571.0" y="94" font-size="13" fill="#475569" text-anchor="middle">new rows in a range</text>
<text x="756.0" y="77" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Mechanism</text>
<text x="756.0" y="94" font-size="13" fill="#475569" text-anchor="middle">how it is enforced</text>
<rect x="24" y="104" width="852" height="46" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="124" font-size="13" fill="#0f172a" font-weight="700">READ UNCOMMITTED</text>
<text x="38" y="141" font-size="13" fill="#475569">same as WITH (NOLOCK)</text>
<rect x="244" y="110" width="106" height="34" rx="6" fill="#fee2e2"/>
<circle cx="259.0" cy="127.0" r="9" fill="#dc2626"/>
<path d="M255.0,123.0 L263.0,131.0 M263.0,123.0 L255.0,131.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="274.0" y="132.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="362" y="110" width="138" height="34" rx="6" fill="#fee2e2"/>
<circle cx="393.0" cy="127.0" r="9" fill="#dc2626"/>
<path d="M389.0,123.0 L397.0,131.0 M397.0,123.0 L389.0,131.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="408.0" y="132.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="512" y="110" width="118" height="34" rx="6" fill="#fee2e2"/>
<circle cx="533.0" cy="127.0" r="9" fill="#dc2626"/>
<path d="M529.0,123.0 L537.0,131.0 M537.0,123.0 L529.0,131.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="548.0" y="132.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="642" y="108" width="228" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="652" y="124" font-size="13" fill="#1f2937"><tspan x="652" dy="0">No shared locks taken on read:</tspan><tspan x="652" dy="16">sees other transactions' dirty rows</tspan></text>
<rect x="24" y="150" width="852" height="46" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="170" font-size="13" fill="#0f172a" font-weight="700">READ COMMITTED</text>
<text x="38" y="187" font-size="13" fill="#475569">SQL Server default (locking)</text>
<rect x="244" y="156" width="106" height="34" rx="6" fill="#dcfce7"/>
<circle cx="259.0" cy="173.0" r="9" fill="#16a34a"/>
<path d="M254.5,173.0 L257.5,176.5 L263.5,169.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="274.0" y="178.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="362" y="156" width="138" height="34" rx="6" fill="#fee2e2"/>
<circle cx="393.0" cy="173.0" r="9" fill="#dc2626"/>
<path d="M389.0,169.0 L397.0,177.0 M397.0,169.0 L389.0,177.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="408.0" y="178.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="512" y="156" width="118" height="34" rx="6" fill="#fee2e2"/>
<circle cx="533.0" cy="173.0" r="9" fill="#dc2626"/>
<path d="M529.0,169.0 L537.0,177.0 M537.0,169.0 L529.0,177.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="548.0" y="178.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="642" y="154" width="228" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="652" y="170" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Shared locks released after each</tspan><tspan x="652" dy="16">read: readers and writers block</tspan></text>
<rect x="24" y="196" width="852" height="46" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="216" font-size="13" fill="#0f172a" font-weight="700">READ COMMITTED SNAPSHOT</text>
<text x="38" y="233" font-size="13" fill="#475569">RCSI, Azure SQL DB default</text>
<rect x="244" y="202" width="106" height="34" rx="6" fill="#dcfce7"/>
<circle cx="259.0" cy="219.0" r="9" fill="#16a34a"/>
<path d="M254.5,219.0 L257.5,222.5 L263.5,215.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="274.0" y="224.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="362" y="202" width="138" height="34" rx="6" fill="#fee2e2"/>
<circle cx="393.0" cy="219.0" r="9" fill="#dc2626"/>
<path d="M389.0,215.0 L397.0,223.0 M397.0,215.0 L389.0,223.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="408.0" y="224.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="512" y="202" width="118" height="34" rx="6" fill="#fee2e2"/>
<circle cx="533.0" cy="219.0" r="9" fill="#dc2626"/>
<path d="M529.0,215.0 L537.0,223.0 M537.0,215.0 L529.0,223.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="548.0" y="224.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="642" y="200" width="228" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
<text x="652" y="216" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Row versions in tempdb, per</tspan><tspan x="652" dy="16">statement; reads take no S locks</tspan></text>
<rect x="24" y="242" width="852" height="46" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="270" font-size="13" fill="#0f172a" font-weight="700">REPEATABLE READ</text>
<rect x="244" y="248" width="106" height="34" rx="6" fill="#dcfce7"/>
<circle cx="259.0" cy="265.0" r="9" fill="#16a34a"/>
<path d="M254.5,265.0 L257.5,268.5 L263.5,261.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="274.0" y="270.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="362" y="248" width="138" height="34" rx="6" fill="#dcfce7"/>
<circle cx="393.0" cy="265.0" r="9" fill="#16a34a"/>
<path d="M388.5,265.0 L391.5,268.5 L397.5,261.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="408.0" y="270.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="512" y="248" width="118" height="34" rx="6" fill="#fee2e2"/>
<circle cx="533.0" cy="265.0" r="9" fill="#dc2626"/>
<path d="M529.0,261.0 L537.0,269.0 M537.0,261.0 L529.0,269.0" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<text x="548.0" y="270.0" font-size="13" fill="#b91c1c" font-weight="700">possible</text>
<rect x="642" y="246" width="228" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="652" y="262" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Shared locks held until commit,</tspan><tspan x="652" dy="16">but no range locks (phantoms)</tspan></text>
<rect x="24" y="288" width="852" height="46" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="308" font-size="13" fill="#0f172a" font-weight="700">SNAPSHOT</text>
<text x="38" y="325" font-size="13" fill="#475569">opt-in per database</text>
<rect x="244" y="294" width="106" height="34" rx="6" fill="#dcfce7"/>
<circle cx="259.0" cy="311.0" r="9" fill="#16a34a"/>
<path d="M254.5,311.0 L257.5,314.5 L263.5,307.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="274.0" y="316.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="362" y="294" width="138" height="34" rx="6" fill="#dcfce7"/>
<circle cx="393.0" cy="311.0" r="9" fill="#16a34a"/>
<path d="M388.5,311.0 L391.5,314.5 L397.5,307.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="408.0" y="316.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="512" y="294" width="118" height="34" rx="6" fill="#dcfce7"/>
<circle cx="533.0" cy="311.0" r="9" fill="#16a34a"/>
<path d="M528.5,311.0 L531.5,314.5 L537.5,307.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="548.0" y="316.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="642" y="292" width="228" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
<text x="652" y="308" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Row versions, per transaction;</tspan><tspan x="652" dy="16">write clash = error 3960, retry</tspan></text>
<rect x="24" y="334" width="852" height="46" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="362" font-size="13" fill="#0f172a" font-weight="700">SERIALIZABLE</text>
<rect x="244" y="340" width="106" height="34" rx="6" fill="#dcfce7"/>
<circle cx="259.0" cy="357.0" r="9" fill="#16a34a"/>
<path d="M254.5,357.0 L257.5,360.5 L263.5,353.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="274.0" y="362.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="362" y="340" width="138" height="34" rx="6" fill="#dcfce7"/>
<circle cx="393.0" cy="357.0" r="9" fill="#16a34a"/>
<path d="M388.5,357.0 L391.5,360.5 L397.5,353.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="408.0" y="362.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="512" y="340" width="118" height="34" rx="6" fill="#dcfce7"/>
<circle cx="533.0" cy="357.0" r="9" fill="#16a34a"/>
<path d="M528.5,357.0 L531.5,360.5 L537.5,353.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="548.0" y="362.0" font-size="13" fill="#15803d" font-weight="700">prevented</text>
<rect x="642" y="338" width="228" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="652" y="354" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Key-range locks until commit:</tspan><tspan x="652" dy="16">most blocking and deadlocks</tspan></text>
<text x="24" y="402" font-size="13" fill="#475569" font-weight="700">Mechanism colour:</text>
<rect x="146" y="389" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="168" y="402" font-size="13" fill="#1f2937">locks (pessimistic)</text>
<rect x="300" y="389" width="16" height="16" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
<text x="322" y="402" font-size="13" fill="#1f2937">row versions in tempdb (optimistic)</text>
<rect x="24" y="418" width="420" height="118" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="442" font-size="14" fill="#b45309" font-weight="700">Lost update / update conflict</text>
<text x="40" y="464" font-size="13" fill="#1f2937"><tspan x="40" dy="0">READ COMMITTED and RCSI allow lost updates on</tspan><tspan x="40" dy="18">read-modify-write. REPEATABLE READ / SERIALIZABLE</tspan><tspan x="40" dy="18">block them (often as a deadlock). SNAPSHOT detects</tspan><tspan x="40" dy="18">them and aborts with error 3960: catch and retry.</tspan></text>
<rect x="456" y="418" width="420" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="472" y="442" font-size="14" fill="#b91c1c" font-weight="700">NOLOCK = READ UNCOMMITTED</text>
<text x="472" y="464" font-size="13" fill="#1f2937"><tspan x="472" dy="0">WITH (NOLOCK) on a table is READ UNCOMMITTED for</tspan><tspan x="472" dy="18">that table: dirty reads, plus rows skipped or read</tspan><tspan x="472" dy="18">twice during page splits. It is not a performance</tspan><tspan x="472" dy="18">fix; prefer RCSI for non-blocking reads.</tspan></text>
<text x="24" y="566" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">RCSI and SNAPSHOT stop readers blocking writers with tempdb versions; only SNAPSHOT and SERIALIZABLE stop phantoms.</tspan></text>
</svg>
