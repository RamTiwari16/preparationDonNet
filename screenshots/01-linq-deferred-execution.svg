<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" role="img">
<title>LINQ Deferred Execution Timeline</title>
<desc>A LINQ query is only a recipe: it runs when enumerated, so changes made to the source after defining it are visible in the result.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="627" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">LINQ Deferred Execution Timeline</text>
<text x="32" y="68" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">A query is a recipe, not a result: nothing runs until something enumerates it</text>
<path d="M40 112 L860 112" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="860" y="100" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="end">time</text>
<circle cx="138" cy="112" r="11" fill="#2563eb"/>
<text x="138" y="117" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="138" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Source created</text>
<rect x="40" y="162" width="196" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="184" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="52" dy="0">var xs = new List&lt;int&gt;</tspan><tspan x="52" dy="20">{ 1, 2, 3 };</tspan></text>
<rect x="40" y="238" width="196" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="138" y="264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle"><tspan x="138" dy="0">xs = [1, 2, 3]</tspan><tspan x="138" dy="22">data ready, no query yet</tspan></text>
<path d="M138 222 L138 236" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<circle cx="346" cy="112" r="11" fill="#b45309"/>
<text x="346" y="117" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="346" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Query defined</text>
<rect x="248" y="162" width="196" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="260" y="184" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="260" dy="0">var q = xs</tspan><tspan x="260" dy="20">.Where(n =&gt; n &gt; 1);</tspan></text>
<rect x="248" y="238" width="196" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="346" y="264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle"><tspan x="346" dy="0">DEFERRED: q is a recipe</tspan><tspan x="346" dy="22">Where() has not run</tspan></text>
<path d="M346 222 L346 236" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<circle cx="554" cy="112" r="11" fill="#2563eb"/>
<text x="554" y="117" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="554" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Source modified</text>
<rect x="456" y="162" width="196" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="468" y="184" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="468" dy="0">xs.Add(4);</tspan></text>
<rect x="456" y="238" width="196" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="554" y="264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle"><tspan x="554" dy="0">xs = [1, 2, 3, 4]</tspan><tspan x="554" dy="22">q still has not run</tspan></text>
<path d="M554 222 L554 236" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<circle cx="762" cy="112" r="11" fill="#15803d"/>
<text x="762" y="117" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="762" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Query enumerated</text>
<rect x="664" y="162" width="196" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="676" y="184" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="676" dy="0">foreach (var n in q)</tspan><tspan x="676" dy="20">  Console.WriteLine(n);</tspan></text>
<rect x="664" y="238" width="196" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="762" y="264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle"><tspan x="762" dy="0">Runs NOW over live xs</tspan><tspan x="762" dy="22">prints 2, 3, 4</tspan></text>
<path d="M762 222 L762 236" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="450" y="330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700" text-anchor="middle">Result reflects the Add(4) made AFTER the query was written</text>
<rect x="32" y="350" width="408" height="164" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="48" y="378" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">DEFERRED (lazy): returns a query</text>
<text x="48" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">runs on foreach / MoveNext</text>
<rect x="48" y="412" width="61" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="78.5" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Where</text>
<rect x="117" y="412" width="68" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="151.0" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Select</text>
<rect x="193" y="412" width="100" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="243.0" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">SelectMany</text>
<rect x="301" y="412" width="76" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="339.0" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">OrderBy</text>
<rect x="48" y="444" width="68" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="82.0" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">ThenBy</text>
<rect x="124" y="444" width="76" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="162.0" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">GroupBy</text>
<rect x="208" y="444" width="53" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="234.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Join</text>
<rect x="269" y="444" width="53" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="295.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Take</text>
<rect x="330" y="444" width="53" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="356.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Skip</text>
<rect x="48" y="476" width="84" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="90.0" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Distinct</text>
<rect x="140" y="476" width="68" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="174.0" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Concat</text>
<rect x="216" y="476" width="45" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="238.5" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="600" text-anchor="middle">Zip</text>
<rect x="460" y="350" width="408" height="164" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="476" y="378" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">IMMEDIATE (eager): returns a value</text>
<text x="476" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">executes the whole query right now</text>
<rect x="476" y="412" width="68" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="510.0" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">ToList</text>
<rect x="552" y="412" width="76" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="590.0" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">ToArray</text>
<rect x="636" y="412" width="115" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="693.5" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">ToDictionary</text>
<rect x="759" y="412" width="61" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="789.5" y="428.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Count</text>
<rect x="476" y="444" width="45" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="498.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Sum</text>
<rect x="529" y="444" width="76" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="567.0" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Average</text>
<rect x="613" y="444" width="45" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="635.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Min</text>
<rect x="666" y="444" width="45" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="688.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Max</text>
<rect x="719" y="444" width="61" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="749.5" y="460.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">First</text>
<rect x="476" y="476" width="68" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="510.0" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Single</text>
<rect x="552" y="476" width="45" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="574.5" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Any</text>
<rect x="605" y="476" width="45" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="627.5" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">All</text>
<rect x="658" y="476" width="84" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="700.0" y="492.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="600" text-anchor="middle">Contains</text>
<rect x="32" y="526" width="836" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="48" y="548" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="48" dy="0">Gotcha: enumerating q twice runs the query twice (and hits the database twice).</tspan><tspan x="48" dy="20">Call ToList() once to take a snapshot, or when the source may change underneath you.</tspan></text>
<text x="32" y="604" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: deferred operators return a recipe; ToList(), Count() and foreach are what actually run it.</text>
</svg>
