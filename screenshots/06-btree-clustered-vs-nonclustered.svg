<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Clustered vs Non-Clustered B-Tree Indexes</title>
<desc>Both index types are B-trees; the clustered leaf level holds the data rows in key order, while the non-clustered leaf holds the index key plus the clustering key, used for a key lookup.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="621" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">Clustered vs Non-Clustered B-Tree Indexes</text>
<rect x="24" y="52" width="414" height="380" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="76" font-size="15" fill="#1d4ed8" font-weight="700">Clustered index (PK Id)</text>
<text x="40" y="96" font-size="13" fill="#334155">leaf level = the table itself, rows sorted by Id</text>
<line x1="191.0" y1="140" x2="95" y2="182" stroke="#d97706" stroke-width="3"/>
<line x1="95" y1="212" x2="95" y2="250" stroke="#d97706" stroke-width="3"/>
<line x1="231.0" y1="140" x2="231" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="231" y1="212" x2="231" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="271.0" y1="140" x2="367" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="367" y1="212" x2="367" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="166" y="110" width="130" height="30" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="231.0" y="130" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">1 | 40 | 80</text>
<text x="304" y="130" font-size="13" fill="#475569" font-style="italic">root</text>
<rect x="36" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="95" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">1 | 15 | 28</text>
<rect x="172" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="231" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">40 | 52 | 66</text>
<rect x="308" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="367" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">80 | 91 | 99</text>
<text x="40" y="236" font-size="13" fill="#475569" font-style="italic">intermediate</text>
<rect x="36" y="250" width="118" height="92" rx="6" fill="#dbeafe" stroke="#d97706" stroke-width="2.5"/>
<rect x="41" y="258" width="108" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="48" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">1  Chen  Oslo</text>
<text x="48" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">2  Adams Rome</text>
<text x="48" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">3  Pike  Lima</text>
<rect x="172" y="250" width="118" height="92" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="184" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">40 Gray  Kyiv</text>
<text x="184" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">41 Lee   Pune</text>
<text x="184" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">42 Zhao  Bonn</text>
<rect x="308" y="250" width="118" height="92" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">80 Ito   Nara</text>
<text x="320" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">81 Shaw  York</text>
<text x="320" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">82 Diaz  Cali</text>
<line x1="156" y1="296" x2="170" y2="296" stroke="#475569" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="292" y1="296" x2="306" y2="296" stroke="#475569" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="184" y="362" font-size="13" fill="#475569" font-style="italic">leaf (pages form a doubly linked list)</text>
<rect x="462" y="52" width="414" height="380" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="478" y="76" font-size="15" fill="#6d28d9" font-weight="700">Non-clustered IX_LastName</text>
<text x="478" y="96" font-size="13" fill="#334155">leaf = key + row locator (the clustering key)</text>
<line x1="629.0" y1="140" x2="533" y2="182" stroke="#d97706" stroke-width="3"/>
<line x1="533" y1="212" x2="533" y2="250" stroke="#d97706" stroke-width="3"/>
<line x1="669.0" y1="140" x2="669" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="669" y1="212" x2="669" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="709.0" y1="140" x2="805" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="805" y1="212" x2="805" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="604" y="110" width="130" height="30" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="669.0" y="130" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">A | Gray | Pike</text>
<text x="742" y="130" font-size="13" fill="#475569" font-style="italic">root</text>
<rect x="474" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="533" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">Adams | Chen</text>
<rect x="610" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="669" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">Gray | Lee</text>
<rect x="746" y="182" width="118" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="805" y="202" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">Pike | Zhao</text>
<text x="478" y="236" font-size="13" fill="#475569" font-style="italic">intermediate</text>
<rect x="474" y="250" width="118" height="92" rx="6" fill="#ede9fe" stroke="#d97706" stroke-width="2.5"/>
<text x="486" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Adams → 2</text>
<text x="486" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Brown → 7</text>
<rect x="479" y="310" width="108" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="486" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Chen  → 1</text>
<rect x="610" y="250" width="118" height="92" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="622" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Gray  → 40</text>
<text x="622" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Kim   → 55</text>
<text x="622" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Lee   → 41</text>
<rect x="746" y="250" width="118" height="92" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="758" y="274" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Pike  → 3</text>
<text x="758" y="300" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Shaw  → 81</text>
<text x="758" y="326" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">Zhao  → 42</text>
<line x1="594" y1="296" x2="608" y2="296" stroke="#475569" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="730" y1="296" x2="744" y2="296" stroke="#475569" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="622" y="362" font-size="13" fill="#475569" font-style="italic">leaf (pages form a doubly linked list)</text>
<circle cx="632" cy="386" r="11" fill="#b45309"/>
<text x="632" y="390.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="650" y="391" font-size="13" fill="#b45309" font-family="Consolas, Menlo, monospace" xml:space="preserve" font-weight="700">Seek: LastName = 'Chen'</text>
<path d="M533,343 V392 H83 V346" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrA)"/>
<circle cx="160" cy="392" r="11" fill="#b45309"/>
<text x="160" y="396.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="44" y="412" font-size="13" fill="#b45309" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Key Lookup: seek the clustered index for Id = 1</text>
<text x="44" y="427" font-size="13" fill="#334155" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">to fetch the remaining columns (one per row found)</text>
<rect x="24" y="448" width="276" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="40" y="472" font-size="15" fill="#15803d" font-weight="700">Index Seek</text>
<text x="40" y="496" font-size="13" fill="#1f2937"><tspan x="40" dy="0">Walk root to leaf: 3-4 page</tspan><tspan x="40" dy="19">reads even for millions of rows</tspan><tspan x="40" dy="19">(O(log n)). Needs a usable key.</tspan></text>
<rect x="312" y="448" width="276" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="328" y="472" font-size="15" fill="#b91c1c" font-weight="700">Index Scan</text>
<text x="328" y="496" font-size="13" fill="#1f2937"><tspan x="328" dy="0">Read every leaf page in order</tspan><tspan x="328" dy="19">(O(n)). Caused by no index,</tspan><tspan x="328" dy="19">functions on the column, LIKE '%x'.</tspan></text>
<rect x="600" y="448" width="276" height="112" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="616" y="472" font-size="15" fill="#0f766e" font-weight="700">Covering index</text>
<text x="616" y="496" font-size="13" fill="#1f2937"><tspan x="616" dy="0">INCLUDE (City) stores the column</tspan><tspan x="616" dy="19">in the non-clustered leaf, so the</tspan><tspan x="616" dy="19">Key Lookup disappears.</tspan></text>
<text x="24" y="600" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">one clustered index per table (it IS the table); every non-clustered index points back to it via the clustering key.</tspan></text>
</svg>
