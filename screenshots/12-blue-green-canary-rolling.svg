<text x="328" y="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#15803d" xml:space="preserve"><tspan x="328" dy="0">+ real-user test, tiny blast radius</tspan><tspan x="328" dy="18">   data-driven promotion</tspan></text>
<text x="328" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" xml:space="preserve"><tspan x="328" dy="0">- needs metrics, traffic splitting,</tspan><tspan x="328" dy="18">   two versions live at once</tspan></text>
