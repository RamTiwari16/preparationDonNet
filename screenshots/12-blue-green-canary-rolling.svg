<text x="40" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" xml:space="preserve"><tspan x="40" dy="0">- 2x infrastructure; DB schema</tspan><tspan x="40" dy="18">   must suit both versions</tspan></text>
