<text x="24" y="508" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-style="italic" xml:space="preserve">Interview takeaway: blue-green = instant flip, canary = gradual % with metrics, rolling = replace instances in place.</text>
