<text x="616" y="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#15803d" xml:space="preserve"><tspan x="616" dy="0">+ no extra environment, built into</tspan><tspan x="616" dy="18">   K8s and App Service</tspan></text>
