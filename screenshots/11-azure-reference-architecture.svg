<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" role="img">
<title>Azure Reference Architecture for .NET</title>
<desc>A typical three-tier .NET app on Azure: Front Door, a static SPA, App Service API with slots, Azure SQL, Redis, Key Vault, Service Bus, Functions and monitoring inside a VNet.</desc>
