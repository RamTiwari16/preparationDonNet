<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>OAuth 2.0 Authorization Code with PKCE</title>
<desc>A browser SPA signs in a user at the authorization server using a one-time code and a PKCE code_verifier, then calls the API with the returned access token.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="735" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">OAuth 2.0 Authorization Code with PKCE</text>
<rect x="40.0" y="52" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="110" y="77" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">User / Browser</text>
<line x1="110" y1="92" x2="110" y2="622" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="255.0" y="52" width="150" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="330" y="77" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">SPA (client app)</text>
<line x1="330" y1="92" x2="330" y2="622" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="495.0" y="52" width="190" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="590" y="70" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Authorization Server</text>
<text x="590" y="86" font-size="13" fill="#334155" text-anchor="middle">(Microsoft Entra ID)</text>
<line x1="590" y1="92" x2="590" y2="622" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="735.0" y="52" width="130" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="800" y="77" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Resource API</text>
<line x1="800" y1="92" x2="800" y2="622" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="110" y1="124" x2="330" y2="124" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="220.0" y="116" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="220.0" dy="0">clicks “Sign in”</tspan></text>
<circle cx="127" cy="124" r="11" fill="#475569"/>
<text x="127" y="128.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="170" y="142" width="330" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="190" cy="163" r="11" fill="#2563eb"/>
<text x="190" y="167.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="206" y="158" font-size="13" fill="#1f2937"><tspan x="206" dy="0">Generate code_verifier (random, 43-128 chars)</tspan><tspan x="206" dy="17">code_challenge = BASE64URL(SHA256(verifier))</tspan></text>
<line x1="330" y1="236" x2="590" y2="236" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="468.0" y="212" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="468.0" dy="0">GET /authorize?client_id&amp;scope&amp;state</tspan><tspan x="468.0" dy="16">&amp;code_challenge=…&amp;method=S256</tspan></text>
<circle cx="347" cy="236" r="11" fill="#2563eb"/>
<text x="347" y="240.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<line x1="590" y1="290" x2="110" y2="290" stroke="#7c3aed" stroke-width="1.8" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
<text x="302.0" y="282" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="302.0" dy="0">User signs in at the Authorization Server: login + MFA + consent</tspan></text>
<circle cx="573" cy="290" r="11" fill="#7c3aed"/>
<text x="573" y="294.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<line x1="590" y1="346" x2="330" y2="346" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrP)"/>
<text x="454.0" y="322" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="454.0" dy="0">302 redirect_uri?code=AUTH_CODE</tspan><tspan x="454.0" dy="16">&amp;state=xyz  (single-use, short-lived)</tspan></text>
<circle cx="573" cy="346" r="11" fill="#7c3aed"/>
<text x="573" y="350.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<line x1="330" y1="402" x2="590" y2="402" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="468.0" y="378" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="468.0" dy="0">POST /token</tspan><tspan x="468.0" dy="16">code + code_verifier + redirect_uri</tspan></text>
<circle cx="347" cy="402" r="11" fill="#2563eb"/>
<text x="347" y="406.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<rect x="425" y="418" width="334" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="445" cy="440" r="11" fill="#7c3aed"/>
<text x="445" y="444.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<text x="462" y="436" font-size="13" fill="#1f2937"><tspan x="462" dy="0">SHA256(code_verifier) must equal the stored</tspan><tspan x="462" dy="17">code_challenge, then the code is burned</tspan></text>
<line x1="590" y1="524" x2="330" y2="524" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
<text x="454.0" y="500" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="454.0" dy="0">access_token + id_token +</tspan><tspan x="454.0" dy="16">refresh_token (offline_access scope)</tspan></text>
<circle cx="573" cy="524" r="11" fill="#7c3aed"/>
<text x="573" y="528.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<line x1="330" y1="574" x2="800" y2="574" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="573.0" y="566" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="573.0" dy="0">GET /orders   Authorization: Bearer &lt;access_token&gt;</tspan></text>
<circle cx="347" cy="574" r="11" fill="#2563eb"/>
<text x="347" y="578.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">9</text>
<line x1="800" y1="612" x2="330" y2="612" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
<text x="557.0" y="604" font-size="13" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="557.0" dy="0">200 OK + JSON  (API validates signature, iss, aud, scope)</tspan></text>
<circle cx="783" cy="612" r="11" fill="#15803d"/>
<text x="783" y="616.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<rect x="24" y="638" width="852" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="660" font-size="13" fill="#1f2937">PKCE: an intercepted code is useless without the verifier. Check state on return (CSRF).</text>
<text x="40" y="680" font-size="13" fill="#1f2937">access_token is for the API, id_token is for the client only. Implicit flow is obsolete: SPAs use code + PKCE.</text>
<text x="24" y="718" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">the browser never sees a client secret; the one-time code plus the PKCE verifier proves the same app finishes the flow.</tspan></text>
</svg>
