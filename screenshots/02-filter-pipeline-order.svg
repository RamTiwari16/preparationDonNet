<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" role="img">
<title>MVC Filter Pipeline Order</title>
<desc>Order in which ASP.NET Core MVC filters run around model binding, the action and the result, with short-circuit points and the scope of exception filters.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrSR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="617" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">MVC Filter Pipeline Order</text>
<rect x="32" y="84" width="420" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="54" cy="106.0" r="11" fill="#7c3aed"/>
<text x="54" y="111.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="76" y="103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#4c1d95" font-weight="700">Authorization filters</text>
<text x="76" y="120" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">[Authorize] / policies run first</text>
<path d="M242.0 128 L242.0 137" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="138" width="420" height="44" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="54" cy="160.0" r="11" fill="#0f766e"/>
<text x="54" y="165.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="76" y="157" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#134e4a" font-weight="700">Resource filters (before)</text>
<text x="76" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">OnResourceExecuting: e.g. response cache</text>
<path d="M242.0 182 L242.0 191" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="192" width="420" height="44" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<circle cx="54" cy="214.0" r="11" fill="#475569"/>
<text x="54" y="219.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="76" y="211" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e293b" font-weight="700">Model binding + validation</text>
<text x="76" y="228" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">fills parameters, ModelState ([ApiController] -&gt; 400)</text>
<path d="M242.0 236 L242.0 245" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="246" width="420" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="54" cy="268.0" r="11" fill="#2563eb"/>
<text x="54" y="273.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="76" y="265" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">Action filters (before)</text>
<text x="76" y="282" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">OnActionExecuting: inspect / validate arguments</text>
<path d="M242.0 290 L242.0 299" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="300" width="420" height="44" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="54" cy="322.0" r="11" fill="#15803d"/>
<text x="54" y="327.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="76" y="319" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">Action method runs</text>
<text x="76" y="336" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">your controller code returns IActionResult</text>
<path d="M242.0 344 L242.0 353" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="354" width="420" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="54" cy="376.0" r="11" fill="#2563eb"/>
<text x="54" y="381.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="76" y="373" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">Action filters (after)</text>
<text x="76" y="390" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">OnActionExecuted: inspect or replace the result</text>
<path d="M242.0 398 L242.0 407" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="408" width="420" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="54" cy="430.0" r="11" fill="#b45309"/>
<text x="54" y="435.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="76" y="427" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">Result filters (before / after)</text>
<text x="76" y="444" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">wrap result execution: headers, envelopes</text>
<path d="M242.0 452 L242.0 461" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="462" width="420" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="54" cy="484.0" r="11" fill="#b45309"/>
<text x="54" y="489.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="76" y="481" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">Result executes</text>
<text x="76" y="498" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">IActionResult writes the HTTP response</text>
<path d="M454 106.0 L478 106.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrSR)"/>
<rect x="482" y="84" width="222" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="494" y="103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="494" dy="0">Short-circuit: 401 / 403</tspan><tspan x="494" dy="17">nothing else runs</tspan></text>
<path d="M454 160.0 L478 160.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrSR)"/>
<rect x="482" y="138" width="222" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="494" y="157" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="494" dy="0">Short-circuit: cached response</tspan><tspan x="494" dy="17">binding + action skipped</tspan></text>
<path d="M454 268.0 L478 268.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrSR)"/>
<rect x="482" y="246" width="222" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="494" y="265" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="494" dy="0">Short-circuit: set context.Result</tspan><tspan x="494" dy="17">action is skipped</tspan></text>
<rect x="726" y="188" width="142" height="214" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="738" y="218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="738" dy="0" font-weight="700">Exception filters</tspan><tspan x="738" dy="18">catch unhandled</tspan><tspan x="738" dy="18">exceptions from</tspan><tspan x="738" dy="18">steps 3 - 6:</tspan><tspan x="738" dy="18">binding, action</tspan><tspan x="738" dy="18">filters, action.</tspan><tspan x="738" dy="18" font-weight="700">Not from results,</tspan><tspan x="738" dy="18" font-weight="700">resource or auth.</tspan></text>
<path d="M720 196 L712 196 L712 394 L720 394" fill="none" stroke="#dc2626" stroke-width="1.5"/>
<rect x="482" y="462" width="222" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="494" y="481" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#134e4a"><tspan x="494" dy="0">then Resource filters (after)</tspan><tspan x="494" dy="17">run last, on the way out</tspan></text>
<path d="M454 484.0 L478 484.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="522" width="836" height="40" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="48" y="547" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Within one stage: Global -&gt; Controller -&gt; Action scope on the way in, reverse on the way out (override with Order).</text>
<text x="32" y="594" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: auth and resource filters wrap everything; exception filters only see binding and action errors.</text>
</svg>
