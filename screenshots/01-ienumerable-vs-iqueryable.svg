<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img">
<title>IEnumerable vs IQueryable</title>
<desc>Side by side: IEnumerable filters rows in C# after fetching them all, while IQueryable turns the lambda into an expression tree and a SQL WHERE clause.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">IEnumerable vs IQueryable</text>
<rect x="32" y="84" width="408" height="442" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="56" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700">IEnumerable&lt;T&gt;</text>
<text x="56" y="134" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">in-memory: LINQ to Objects, lambdas are delegates</text>
<rect x="48" y="146" width="376" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="64" y="168" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="64" dy="0">db.Orders.AsEnumerable()</tspan><tspan x="64" dy="20">  .Where(o =&gt; o.Total &gt; 100).ToList();</tspan></text>
<rect x="48" y="214" width="376" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="74" cy="242" r="11" fill="#2563eb"/>
<text x="74" y="247" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="98" y="238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">Where(Func&lt;T,bool&gt;)</text>
<text x="98" y="258" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">compiled delegate: opaque to the database</text>
<path d="M236 270 L236 292" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="294" width="376" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="74" cy="322" r="11" fill="#b45309"/>
<text x="74" y="327" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="98" y="318" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">SQL sent: SELECT * FROM Orders</text>
<text x="98" y="338" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">no WHERE clause at all</text>
<path d="M236 350 L236 372" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="374" width="376" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<circle cx="74" cy="402" r="11" fill="#dc2626"/>
<text x="74" y="407" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="98" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="700">ALL 1,000,000 rows travel to the app</text>
<text x="98" y="418" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">materialized in memory, then iterated</text>
<path d="M236 430 L236 452" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="454" width="376" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="74" cy="482" r="11" fill="#b45309"/>
<text x="74" y="487" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="98" y="478" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">Filter runs in C# (foreach)</text>
<text x="98" y="498" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">12 rows kept, 999,988 fetched for nothing</text>
<rect x="32" y="536" width="408" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="48" y="558" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d"><tspan x="48" dy="0">Gotcha: calling AsEnumerable() / ToList() too early</tspan><tspan x="48" dy="20">pulls the whole table into memory</tspan></text>
<rect x="460" y="84" width="408" height="442" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="484" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700">IQueryable&lt;T&gt;</text>
<text x="484" y="134" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">provider-based: EF Core, lambdas become expression trees</text>
<rect x="476" y="146" width="376" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="492" y="168" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#334155"><tspan x="492" dy="0">db.Orders</tspan><tspan x="492" dy="20">  .Where(o =&gt; o.Total &gt; 100).ToList();</tspan></text>
<rect x="476" y="214" width="376" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="502" cy="242" r="11" fill="#2563eb"/>
<text x="502" y="247" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="526" y="238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">Where(Expression&lt;Func&lt;T,bool&gt;&gt;)</text>
<text x="526" y="258" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">code as data: a tree the provider can read</text>
<path d="M664 270 L664 292" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="476" y="294" width="376" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="502" cy="322" r="11" fill="#0f766e"/>
<text x="502" y="327" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="526" y="318" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#134e4a" font-weight="700">Provider translates tree to SQL</text>
<text x="526" y="338" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">WHERE Total &gt; 100  (parameterized)</text>
<path d="M664 350 L664 372" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="476" y="374" width="376" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="502" cy="402" r="11" fill="#15803d"/>
<text x="502" y="407" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="526" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">Database filters using its indexes</text>
<text x="526" y="418" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the work happens where the data lives</text>
<path d="M664 430 L664 452" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="476" y="454" width="376" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="502" cy="482" r="11" fill="#15803d"/>
<text x="502" y="487" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="526" y="478" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">Only the 12 matching rows return</text>
<text x="526" y="498" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">materialized once, when ToList() runs</text>
<rect x="460" y="536" width="408" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="476" y="558" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78350f"><tspan x="476" dy="0">Gotcha: a C# method inside Where() may not translate;</tspan><tspan x="476" dy="20">compose the query, then materialize last</tspan></text>
<circle cx="450" cy="300" r="22" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="450" y="306" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">vs</text>
<text x="32" y="616" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: IEnumerable runs the predicate in your process; IQueryable ships it to the database as SQL.</text>
</svg>
