<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" role="img">
<title>React Hooks Lifecycle</title>
<desc>One React render cycle (render, commit, layout effects, paint, effects) and how useEffect setup and cleanup map to mount, update and unmount.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="603" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold" xml:space="preserve">React Hooks Lifecycle</text>
<text x="24" y="66" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">One render cycle</text>
<rect x="24.0" y="80" width="128" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="88.0" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold" xml:space="preserve">Trigger</text>
<text x="88.0" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="88.0" dy="0">setState / props</tspan><tspan x="88.0" dy="18">/ context change</tspan></text>
<circle cx="30.0" cy="84" r="11" fill="#475569"/>
<text x="30.0" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<line x1="153.0" y1="118" x2="167.8" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="168.8" y="80" width="128" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="232.8" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold" xml:space="preserve">Render</text>
<text x="232.8" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="232.8" dy="0">runs your fn,</tspan><tspan x="232.8" dy="18">must be pure</tspan></text>
<circle cx="174.8" cy="84" r="11" fill="#2563eb"/>
<text x="174.8" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<line x1="297.8" y1="118" x2="312.6" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="313.6" y="80" width="128" height="76" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="377.6" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold" xml:space="preserve">Commit</text>
<text x="377.6" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="377.6" dy="0">React updates</tspan><tspan x="377.6" dy="18">the real DOM</tspan></text>
<circle cx="319.6" cy="84" r="11" fill="#0f766e"/>
<text x="319.6" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<line x1="442.6" y1="118" x2="457.4" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="458.4" y="80" width="128" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="522.4" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold" xml:space="preserve">useLayoutEffect</text>
<text x="522.4" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="522.4" dy="0">sync, pre-paint</tspan><tspan x="522.4" dy="18">measure the DOM</tspan></text>
<circle cx="464.4" cy="84" r="11" fill="#7c3aed"/>
<text x="464.4" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<line x1="587.4" y1="118" x2="602.2" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="603.2" y="80" width="128" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="667.2" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold" xml:space="preserve">Browser paints</text>
<text x="667.2" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="667.2" dy="0">draws the</tspan><tspan x="667.2" dy="18">new pixels</tspan></text>
<circle cx="609.2" cy="84" r="11" fill="#475569"/>
<text x="609.2" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<line x1="732.2" y1="118" x2="747.0" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="748.0" y="80" width="128" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="812.0" y="99.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold" xml:space="preserve">useEffect</text>
<text x="812.0" y="122.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve"><tspan x="812.0" dy="0">async, post-paint</tspan><tspan x="812.0" dy="18">fetch, subscribe</tspan></text>
<circle cx="754.0" cy="84" r="11" fill="#15803d"/>
<text x="754.0" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="24" y="190" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">useEffect over time: setup runs after paint, cleanup runs before the next setup</text>
<text x="24" y="231" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">Mount</text>
<rect x="128" y="206" width="150" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="203" y="230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" xml:space="preserve">render</text>
<line x1="279" y1="225" x2="301" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="302" y="206" width="150" height="38" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="377" y="230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" xml:space="preserve">commit</text>
<line x1="453" y1="225" x2="475" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="476" y="206" width="150" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="551" y="230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">effect() runs</text>
<text x="650" y="223" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve"><tspan x="650" dy="0">setup: fetch, subscribe,</tspan><tspan x="650" dy="17">start a timer</tspan></text>
<text x="24" y="283" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">Update</text>
<rect x="128" y="258" width="150" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="203" y="282" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" xml:space="preserve">render</text>
<line x1="279" y1="277" x2="301" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="302" y="258" width="150" height="38" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="377" y="282" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" xml:space="preserve">commit</text>
<line x1="453" y1="277" x2="475" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="476" y="258" width="150" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="551" y="282" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">cleanup(previous)</text>
<line x1="627" y1="277" x2="649" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="650" y="258" width="150" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="725" y="282" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">effect() re-runs</text>
<text x="24" y="335" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">Unmount</text>
<rect x="128" y="310" width="150" height="38" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="203" y="334" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" xml:space="preserve">component removed</text>
<line x1="279" y1="329" x2="301" y2="329" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="302" y="310" width="150" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="377" y="334" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" xml:space="preserve">cleanup() runs</text>
<text x="476" y="327" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve"><tspan x="476" dy="0">cleanup: unsubscribe, clear timers,</tspan><tspan x="476" dy="17">abort in-flight requests</tspan></text>
<text x="24" y="380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" font-weight="bold" xml:space="preserve">Dependency array decides when it re-runs</text>
<rect x="24" y="392" width="276" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="416" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1d4ed8" font-weight="bold" xml:space="preserve">useEffect(fn, [])</text>
<text x="40" y="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="40" dy="0">Runs once, after the first paint.</tspan><tspan x="40" dy="18">Cleanup: only when the component</tspan><tspan x="40" dy="18">unmounts.</tspan><tspan x="40" dy="18">Class version: didMount + willUnmount</tspan></text>
<rect x="312" y="392" width="276" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="328" y="416" font-family="Consolas, Menlo, monospace" font-size="14" fill="#15803d" font-weight="bold" xml:space="preserve">useEffect(fn, [dep])</text>
<text x="328" y="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="328" dy="0">Runs after mount, then whenever dep</tspan><tspan x="328" dy="18">changes (compared with Object.is).</tspan><tspan x="328" dy="18">Cleanup: before each re-run, and on</tspan><tspan x="328" dy="18">unmount. Class: componentDidUpdate</tspan></text>
<rect x="600" y="392" width="276" height="112" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="616" y="416" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b91c1c" font-weight="bold" xml:space="preserve">useEffect(fn)</text>
<text x="616" y="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="616" dy="0">Runs after EVERY render.</tspan><tspan x="616" dy="18">Cleanup: before every re-run and on</tspan><tspan x="616" dy="18">unmount. Rarely wanted; setState</tspan><tspan x="616" dy="18">inside it can loop forever.</tspan></text>
<rect x="24" y="516" width="852" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="538" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve">Gotchas: StrictMode (dev) runs setup, cleanup, setup again to expose missing cleanup. List every prop/state the effect</text>
<text x="40" y="557" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve">reads in [deps] to avoid stale closures. useLayoutEffect blocks painting, so use it only to measure or fix layout.</text>
<text x="24" y="584" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-style="italic" xml:space="preserve">Interview takeaway: render is pure, effects are for side effects, and every setup that subscribes needs a cleanup.</text>
</svg>
