<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img">
<title>HLD Interview Seven-Step Framework</title>
<desc>Seven ordered steps for a high-level design interview with what to do, what to produce and a time budget for a 45-minute round.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<text x="32" y="40" font-size="20" fill="#0f172a" font-weight="bold">HLD Interview Seven-Step Framework</text>
<text x="32" y="62" font-size="13.5" fill="#475569">Follow the same order every time so the interviewer can follow your thinking.</text>
<text x="60" y="100" font-size="13" fill="#475569" font-weight="bold">Step</text>
<text x="256" y="100" font-size="13" fill="#475569" font-weight="bold">What you do</text>
<text x="662" y="100" font-size="13" fill="#475569" font-weight="bold">You produce</text>
<text x="868" y="100" font-size="13" fill="#475569" text-anchor="end" font-weight="bold">Time</text>
<rect x="56" y="108" width="820" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="56" y="108" width="180" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="146" y="136.04" font-size="14" fill="#1e3a8a" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">Requirements</tspan></text>
<circle cx="40" cy="131" r="11" fill="#2563eb"/>
<text x="40" y="135.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="252" y="128" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Ask who the users are and which features are in or</tspan><tspan x="252" dy="18">out of scope. Pin down NFRs: latency, availability.</tspan></text>
<line x1="650" y1="116" x2="650" y2="146" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="128" font-size="13" fill="#1f2937"><tspan x="662" dy="0">Scope list + NFR</tspan><tspan x="662" dy="18">targets</tspan></text>
<rect x="808" y="119" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="838" y="135.68" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">5 min</text>
<polyline points="146,154 146,166" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="166" width="820" height="46" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<rect x="56" y="166" width="180" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="146" y="194.04" font-size="14" fill="#134e4a" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">Estimation</tspan></text>
<circle cx="40" cy="189" r="11" fill="#0f766e"/>
<text x="40" y="193.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="252" y="186" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Back-of-envelope: peak QPS, storage per year, bandwidth,</tspan><tspan x="252" dy="18">read:write ratio. Round numbers and show the math.</tspan></text>
<line x1="650" y1="174" x2="650" y2="204" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="186" font-size="13" fill="#1f2937"><tspan x="662" dy="0">QPS, storage,</tspan><tspan x="662" dy="18">read:write ratio</tspan></text>
<rect x="808" y="177" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="838" y="193.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="bold">5 min</text>
<polyline points="146,212 146,224" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="224" width="820" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="56" y="224" width="180" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="146" y="252.04" font-size="14" fill="#14532d" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">API design</tspan></text>
<circle cx="40" cy="247" r="11" fill="#15803d"/>
<text x="40" y="251.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="252" y="244" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Endpoints and contracts: REST or gRPC, pagination,</tspan><tspan x="252" dy="18">idempotency keys, auth and versioning.</tspan></text>
<line x1="650" y1="232" x2="650" y2="262" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="244" font-size="13" fill="#1f2937"><tspan x="662" dy="0">Endpoint list with</tspan><tspan x="662" dy="18">request / response</tspan></text>
<rect x="808" y="235" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="838" y="251.68" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">5 min</text>
<polyline points="146,270 146,282" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="282" width="820" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="56" y="282" width="180" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="146" y="310.04" font-size="14" fill="#78350f" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">Data model</tspan></text>
<circle cx="40" cy="305" r="11" fill="#b45309"/>
<text x="40" y="309.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="252" y="302" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Entities, keys and relationships; SQL or NoSQL; indexes</tspan><tspan x="252" dy="18">and partition key chosen from the access patterns.</tspan></text>
<line x1="650" y1="290" x2="650" y2="320" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="302" font-size="13" fill="#1f2937"><tspan x="662" dy="0">Tables or collections</tspan><tspan x="662" dy="18">+ keys and indexes</tspan></text>
<rect x="808" y="293" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="838" y="309.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="bold">5 min</text>
<polyline points="146,328 146,340" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="340" width="820" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="56" y="340" width="180" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="146" y="368.04" font-size="14" fill="#4c1d95" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">High-level design</tspan></text>
<circle cx="40" cy="363" r="11" fill="#7c3aed"/>
<text x="40" y="367.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="252" y="360" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Boxes and arrows: client, LB, services, cache, DB, queue.</tspan><tspan x="252" dy="18">Walk the read path and the write path end to end.</tspan></text>
<line x1="650" y1="348" x2="650" y2="378" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="360" font-size="13" fill="#1f2937"><tspan x="662" dy="0">One clean diagram of</tspan><tspan x="662" dy="18">both request paths</tspan></text>
<rect x="808" y="351" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="838" y="367.68" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="bold">10 min</text>
<polyline points="146,386 146,398" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="398" width="820" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="56" y="398" width="180" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="146" y="426.04" font-size="14" fill="#7f1d1d" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">Deep dive</tspan></text>
<circle cx="40" cy="421" r="11" fill="#dc2626"/>
<text x="40" y="425.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="252" y="418" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Go deep where the interviewer points: sharding, caching,</tspan><tspan x="252" dy="18">consistency, a hot component, a key algorithm.</tspan></text>
<line x1="650" y1="406" x2="650" y2="436" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="418" font-size="13" fill="#1f2937"><tspan x="662" dy="0">Detail of 1-2</tspan><tspan x="662" dy="18">critical components</tspan></text>
<rect x="808" y="409" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="838" y="425.68" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="bold">10 min</text>
<polyline points="146,444 146,456" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="56" y="456" width="820" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<rect x="56" y="456" width="180" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="146" y="475.54" font-size="14" fill="#1e293b" text-anchor="middle"><tspan x="146" dy="0" font-weight="bold">Bottlenecks and</tspan><tspan x="146" dy="17" font-weight="bold">trade-offs</tspan></text>
<circle cx="40" cy="479" r="11" fill="#475569"/>
<text x="40" y="483.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="252" y="476" font-size="13" fill="#1f2937"><tspan x="252" dy="0">Find single points of failure, hot spots and failure modes;</tspan><tspan x="252" dy="18">add monitoring; say what changes at 10x scale.</tspan></text>
<line x1="650" y1="464" x2="650" y2="494" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
<text x="662" y="476" font-size="13" fill="#1f2937"><tspan x="662" dy="0">Trade-off table,</tspan><tspan x="662" dy="18">what breaks at 10x</tspan></text>
<rect x="808" y="467" width="60" height="24" rx="12.0" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="838" y="483.68" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="bold">5 min</text>
<text x="24" y="542" font-size="14" fill="#0f172a" font-weight="bold">Time budget for a 45-minute round</text>
<text x="876" y="542" font-size="13" fill="#334155" text-anchor="end">Say the plan out loud first; the interviewer steers the deep dive.</text>
<rect x="24" y="554" width="94.67" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="71.33" y="573.18" font-size="13" fill="#1e3a8a" text-anchor="middle"><tspan x="71.33" dy="0" font-weight="bold">Reqs</tspan><tspan x="71.33" dy="17">5 min</tspan></text>
<rect x="118.67" y="554" width="94.67" height="46" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="166" y="573.18" font-size="13" fill="#134e4a" text-anchor="middle"><tspan x="166" dy="0" font-weight="bold">Estimate</tspan><tspan x="166" dy="17">5 min</tspan></text>
<rect x="213.33" y="554" width="94.67" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="260.67" y="573.18" font-size="13" fill="#14532d" text-anchor="middle"><tspan x="260.67" dy="0" font-weight="bold">API</tspan><tspan x="260.67" dy="17">5 min</tspan></text>
<rect x="308" y="554" width="94.67" height="46" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="355.33" y="573.18" font-size="13" fill="#78350f" text-anchor="middle"><tspan x="355.33" dy="0" font-weight="bold">Data</tspan><tspan x="355.33" dy="17">5 min</tspan></text>
<rect x="402.67" y="554" width="189.33" height="46" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="497.33" y="573.18" font-size="13" fill="#4c1d95" text-anchor="middle"><tspan x="497.33" dy="0" font-weight="bold">High-level design</tspan><tspan x="497.33" dy="17">10 min</tspan></text>
<rect x="592" y="554" width="189.33" height="46" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="686.67" y="573.18" font-size="13" fill="#7f1d1d" text-anchor="middle"><tspan x="686.67" dy="0" font-weight="bold">Deep dive</tspan><tspan x="686.67" dy="17">10 min</tspan></text>
<rect x="781.33" y="554" width="94.67" height="46" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="828.67" y="573.18" font-size="13" fill="#1e293b" text-anchor="middle"><tspan x="828.67" dy="0" font-weight="bold">Trade-offs</tspan><tspan x="828.67" dy="17">5 min</tspan></text>
<text x="32" y="632" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: clarify first, estimate, keep the first design simple, then go deep where you are steered.</text>
</g>
</svg>
