<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>EF Core Change Tracker Entity States</title>
<desc>State machine of EF Core entity states (Detached, Added, Unchanged, Modified, Deleted) with the calls that move an entity between them and the SQL SaveChanges emits.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="643" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">EF Core Change Tracker Entity States</text>
<path d="M750,113 V84 H110 V273" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="430" y="77" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">AsNoTracking(): entities are returned but never enter the tracker</text>
<line x1="185" y1="286" x2="375" y2="152" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
<text x="262" y="206" font-size="14" fill="#15803d" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Add()</text>
<line x1="185" y1="300" x2="375" y2="300" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="280" y="292" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Attach()</text>
<line x1="450" y1="167" x2="450" y2="273" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="440" y="214" font-size="13" fill="#334155" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="440" dy="0">SaveChanges()</tspan><tspan x="440" dy="16">row inserted</tspan></text>
<line x1="675" y1="160" x2="525" y2="283" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrT)"/>
<text x="612" y="236" font-size="13" fill="#0f766e" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="612" dy="0">tracking</tspan><tspan x="612" dy="16">query</tspan></text>
<line x1="525" y1="290" x2="675" y2="290" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="600" y="282" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">set a property</text>
<line x1="675" y1="312" x2="525" y2="312" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="600" y="330" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="600" dy="0">SaveChanges()</tspan><tspan x="600" dy="16">row updated</tspan></text>
<line x1="450" y1="327" x2="450" y2="443" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrR)"/>
<text x="440" y="392" font-size="14" fill="#b91c1c" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Remove()</text>
<line x1="730" y1="327" x2="527" y2="458" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrR)"/>
<text x="645" y="400" font-size="14" fill="#b91c1c" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Remove()</text>
<line x1="375" y1="474" x2="125" y2="327" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="222" y="432" font-size="13" fill="#334155" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="222" dy="0">SaveChanges()</tspan><tspan x="222" dy="16">row deleted</tspan></text>
<rect x="35.0" y="273.0" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="110" y="297" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">Detached</text>
<text x="110" y="315" font-size="13" fill="#334155" text-anchor="middle">not tracked</text>
<rect x="375.0" y="113.0" width="150" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="450" y="137" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Added</text>
<text x="450" y="155" font-size="13" fill="#334155" text-anchor="middle">SaveChanges: INSERT</text>
<rect x="375.0" y="273.0" width="150" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450" y="297" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">Unchanged</text>
<text x="450" y="315" font-size="13" fill="#334155" text-anchor="middle">no SQL</text>
<rect x="675.0" y="273.0" width="150" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="750" y="297" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">Modified</text>
<text x="750" y="315" font-size="13" fill="#334155" text-anchor="middle">SaveChanges: UPDATE</text>
<rect x="375.0" y="443.0" width="150" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="467" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700">Deleted</text>
<text x="450" y="485" font-size="13" fill="#334155" text-anchor="middle">SaveChanges: DELETE</text>
<rect x="675.0" y="113.0" width="150" height="54" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="750" y="137" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">DB query</text>
<text x="750" y="155" font-size="13" fill="#334155" text-anchor="middle">rows from SQL</text>
<rect x="24" y="516" width="852" height="82" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="40" y="538" font-size="14" fill="#0f172a" font-weight="700">Good to know</text>
<text x="40" y="560" font-size="13" fill="#1f2937"><tspan x="40" dy="0">DetectChanges compares each tracked entity with its original snapshot; SaveChanges calls it for you.</tspan><tspan x="40" dy="18">Update(e) = attach and mark every column Modified.  Entry(e).State = ... sets any state by hand.</tspan></text>
<text x="24" y="626" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">only Added, Modified and Deleted produce SQL; after a successful SaveChanges they become Unchanged (or Detached).</tspan></text>
</svg>
