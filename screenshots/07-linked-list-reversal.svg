<text x="40" y="633" font-size="13" fill="#1f2937"><tspan fill="#15803d" font-weight="700">Loop ends (curr = null). </tspan><tspan font-family="Consolas, Menlo, monospace">return prev:  3 → 2 → 1 → null</tspan></text>
<text x="860" y="633" font-size="13" fill="#475569" text-anchor="end" font-style="italic">red arrow = link flipped in that iteration (pointers shown before step 3)</text>
<text x="24" y="670" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">each iteration saves next, flips one link backwards, then moves prev and curr one step right.</tspan></text>
</svg>
