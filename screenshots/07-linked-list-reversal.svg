<rect x="24" y="398" width="852" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40" y="424" font-size="15" fill="#0f172a" font-weight="700">Iteration 2</text>
<text x="40" y="446" font-size="13" fill="#334155"><tspan x="40" dy="0">1 save next = 3</tspan><tspan x="40" dy="17">2 flip 2.next = 1</tspan><tspan x="40" dy="17">3 then prev = 2, curr = 3</tspan></text>
<rect x="300" y="418" width="56" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
