<line x1="606" y1="220" x2="665" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="730" y1="220" x2="789" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
