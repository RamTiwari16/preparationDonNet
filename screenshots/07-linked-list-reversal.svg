<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Reversing a Linked List In Place</title>
<desc>Four snapshots of reversing 1 to 2 to 3 to null with prev, curr and next pointers, flipping one link per loop iteration.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="683" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">Reversing a Linked List In Place</text>
<rect x="24" y="52" width="852" height="120" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<rect x="36" y="96" width="420" height="54" rx="4" fill="#fef3c7"/>
<text x="48" y="72" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve"><tspan x="48" dy="0">ListNode prev = null, curr = head;</tspan><tspan x="48" dy="18">while (curr != null) {</tspan><tspan x="48" dy="18">    var next = curr.next;      // 1 save</tspan><tspan x="48" dy="18">    curr.next = prev;          // 2 flip</tspan><tspan x="48" dy="18">    prev = curr; curr = next;  // 3 advance</tspan><tspan x="48" dy="18">}  return prev;  // new head</tspan></text>
<text x="490" y="76" font-size="14" fill="#0f172a" font-weight="700">Three pointers, one pass</text>
<text x="490" y="98" font-size="13" fill="#1f2937"><tspan x="490" dy="0">O(n) time, O(1) extra space (recursion: O(n) stack).</tspan><tspan x="490" dy="19">Gotcha: save next BEFORE flipping, otherwise the</tspan><tspan x="490" dy="19">rest of the list becomes unreachable.</tspan></text>
<rect x="24" y="186" width="852" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40" y="212" font-size="15" fill="#0f172a" font-weight="700">Start</text>
<text x="40" y="234" font-size="13" fill="#334155"><tspan x="40" dy="0">prev = null</tspan><tspan x="40" dy="17">curr = head (1)</tspan></text>
<rect x="300" y="206" width="56" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="328.0" y="225" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">null</text>
