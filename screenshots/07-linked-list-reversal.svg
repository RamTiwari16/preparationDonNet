<line x1="606" y1="326" x2="665" y2="326" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="730" y1="326" x2="789" y2="326" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="328.0" y1="362" x2="328.0" y2="350" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
<rect x="303.0" y="362" width="50" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="328.0" y="377" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">prev</text>
<line x1="450.0" y1="362" x2="450.0" y2="350" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
<rect x="425.0" y="362" width="50" height="20" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="450.0" y="377" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">curr</text>
<line x1="574.0" y1="362" x2="574.0" y2="350" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrP)"/>
