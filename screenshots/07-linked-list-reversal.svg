<text x="450.0" y="226" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<rect x="544" y="200" width="60" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
