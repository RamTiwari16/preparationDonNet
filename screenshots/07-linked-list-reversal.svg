<text x="450.0" y="271" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">curr</text>
<rect x="24" y="292" width="852" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40" y="318" font-size="15" fill="#0f172a" font-weight="700">Iteration 1</text>
<text x="40" y="340" font-size="13" fill="#334155"><tspan x="40" dy="0">1 save next = 2</tspan><tspan x="40" dy="17">2 flip 1.next = null</tspan><tspan x="40" dy="17">3 then prev = 1, curr = 2</tspan></text>
