<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>JWT Structure and Request Flow</title>
<desc>A JWT is three base64url parts (header, payload, signature) that the API verifies on every request after the client logs in and receives the token.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">JWT Structure and Request Flow</text>
<text x="24" y="66" font-size="14" fill="#b45309" font-weight="700">1  HEADER</text>
<rect x="24" y="74" width="250" height="32" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="149.0" y="95" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace">eyJhbGciOiJIUzI1NiIsInR5cCI6...</text>
<text x="290" y="66" font-size="14" fill="#6d28d9" font-weight="700">2  PAYLOAD (claims)</text>
<rect x="290" y="74" width="330" height="32" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="455.0" y="95" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace">eyJzdWIiOiI0MiIsImlzcyI6Imh0dHBzOi...</text>
<text x="636" y="66" font-size="14" fill="#0f766e" font-weight="700">3  SIGNATURE</text>
<rect x="636" y="74" width="240" height="32" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="756.0" y="95" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace">SflKxwRJSMeKKF2QT4fwpMeJf36P...</text>
<text x="282" y="97" font-size="26" fill="#1f2937" text-anchor="middle" font-weight="700">.</text>
<text x="628" y="97" font-size="26" fill="#1f2937" text-anchor="middle" font-weight="700">.</text>
<rect x="24" y="118" width="250" height="180" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="38" y="140" font-size="13" fill="#475569" font-weight="700">Decoded JSON</text>
<text x="38" y="164" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace"><tspan x="38" dy="0">{</tspan><tspan x="38" dy="20">  &quot;alg&quot;: &quot;HS256&quot;,</tspan><tspan x="38" dy="20">  &quot;typ&quot;: &quot;JWT&quot;</tspan><tspan x="38" dy="20">}</tspan></text>
<text x="38" y="252" font-size="13" fill="#1f2937"><tspan x="38" dy="0">Which algorithm signed it.</tspan><tspan x="38" dy="17">Pin allowed algorithms;</tspan><tspan x="38" dy="17">never accept alg = none.</tspan></text>
<rect x="290" y="118" width="330" height="180" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="304" y="140" font-size="13" fill="#475569" font-weight="700">Decoded JSON (claims)</text>
<text x="304" y="164" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace"><tspan x="304" dy="0">{</tspan><tspan x="304" dy="18">  &quot;sub&quot;: &quot;42&quot;,</tspan><tspan x="304" dy="18">  &quot;iss&quot;: &quot;https://auth.contoso.com&quot;,</tspan><tspan x="304" dy="18">  &quot;aud&quot;: &quot;orders-api&quot;,</tspan><tspan x="304" dy="18">  &quot;exp&quot;: 1767225600,</tspan><tspan x="304" dy="18">  &quot;role&quot;: &quot;Admin&quot;</tspan><tspan x="304" dy="18">}</tspan></text>
<text x="304" y="290" font-size="13" fill="#b91c1c" font-weight="700"><tspan x="304" dy="0">Encoded, not encrypted: no secrets here.</tspan></text>
<rect x="636" y="118" width="240" height="180" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="650" y="140" font-size="13" fill="#475569" font-weight="700">Computed, not decoded</text>
<text x="650" y="164" font-size="13" fill="#1f2937" font-family="Consolas, Menlo, monospace"><tspan x="650" dy="0">HMACSHA256(</tspan><tspan x="650" dy="20">  base64url(header) + &quot;.&quot; +</tspan><tspan x="650" dy="20">  base64url(payload),</tspan><tspan x="650" dy="20">  secret)</tspan></text>
<text x="650" y="256" font-size="13" fill="#1f2937"><tspan x="650" dy="0">or RSA/ECDSA: sign with the</tspan><tspan x="650" dy="17">private key, verify with the</tspan><tspan x="650" dy="17">public key (RS256, ES256)</tspan></text>
<text x="24" y="330" font-size="15" fill="#0f172a" font-weight="700">How it flows</text>
<rect x="50.0" y="340" width="160" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="360" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Client (SPA / app)</text>
<line x1="130" y1="370" x2="130" y2="584" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="335.0" y="340" width="190" height="30" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="430" y="360" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Auth endpoint (login)</text>
<line x1="430" y1="370" x2="430" y2="584" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="675.0" y="340" width="150" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="750" y="360" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Resource API</text>
<line x1="750" y1="370" x2="750" y2="584" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="130" y1="402" x2="430" y2="402" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="280.0" y="394" font-size="14" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /login  { user, password }</text>
<circle cx="170.44203125" cy="389" r="11" fill="#2563eb"/>
<text x="170.44203125" y="393.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<line x1="430" y1="440" x2="130" y2="440" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrT)"/>
<text x="298.0" y="432" font-size="14" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200 OK  { access_token: &lt;signed JWT&gt; }</text>
<circle cx="160.18609375" cy="427" r="11" fill="#0f766e"/>
<text x="160.18609375" y="431.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<line x1="130" y1="478" x2="750" y2="478" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<text x="440.0" y="470" font-size="14" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">GET /orders   Authorization: Bearer &lt;jwt&gt;</text>
<circle cx="297.007734375" cy="465" r="11" fill="#2563eb"/>
<text x="297.007734375" y="469.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="600" y="492" width="276" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="620" cy="516" r="11" fill="#15803d"/>
<text x="620" y="520.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="738" y="511" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="738" dy="0">Validate: signature (key), iss,</tspan><tspan x="738" dy="18">aud, exp / nbf, then read claims</tspan></text>
<line x1="750" y1="566" x2="130" y2="566" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
<text x="480.0" y="558" font-size="14" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200 OK  or  401 + WWW-Authenticate: Bearer</text>
<circle cx="323.112734375" cy="553" r="11" fill="#15803d"/>
<text x="323.112734375" y="557.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="150" y="510" font-size="13" fill="#334155" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="150" dy="0">Stateless: the signature is the proof,</tspan><tspan x="150" dy="17">no session lookup. exp is checked with a</tspan><tspan x="150" dy="17">5 min clock skew by default.</tspan></text>
<text x="24" y="622" font-size="14" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">a JWT is signed, not secret; the API trusts it only after verifying signature, issuer, audience and expiry.</tspan></text>
</svg>
