<line x1="760" y1="166" x2="760" y2="142" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<line x1="830" y1="166" x2="830" y2="142" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<text x="710" y="130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" xml:space="preserve">each merge: CI green, auto deploy</text>
<text x="690" y="262" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" xml:space="preserve">branches live hours, not weeks</text>
<rect x="472" y="280" width="392" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="484" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" font-weight="bold" xml:space="preserve">Feature flag hides unfinished work in prod:</text>
<text x="484" y="324" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve">if (await flags.IsEnabledAsync("NewCheckout"))</text>
<rect x="24" y="368" width="420" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="392" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="40" dy="0">+ clear release and hotfix process, parallel versions</tspan><tspan x="40" dy="20">- long-lived branches, painful merges, slower CI</tspan><tspan x="40" dy="20">Fits: versioned products, scheduled releases</tspan></text>
<rect x="456" y="368" width="420" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="472" y="392" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="472" dy="0">+ real continuous integration, small PRs, fast deploys</tspan><tspan x="472" dy="20">- needs strong automated tests + feature flags</tspan><tspan x="472" dy="20">Fits: SaaS and web apps doing continuous delivery</tspan></text>
<text x="24" y="492" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-style="italic" xml:space="preserve">Interview takeaway: GitFlow suits scheduled releases; trunk-based + feature flags is what enables true CI/CD.</text>
</svg>
