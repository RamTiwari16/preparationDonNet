<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img">
<title>GitFlow vs Trunk-Based Development</title>
<desc>GitFlow with long-lived main, develop, feature, release and hotfix branches compared with trunk-based development using short-lived branches and feature flags.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="511" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold" xml:space="preserve">GitFlow vs Trunk-Based Development</text>
<rect x="24" y="56" width="420" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="80" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">GitFlow</text>
<text x="40" y="100" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve">long-lived main + develop, branch per purpose</text>
<text x="40" y="141" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="bold" xml:space="preserve">main</text>
<text x="40" y="181" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#dc2626" font-weight="bold" xml:space="preserve">hotfix</text>
<text x="40" y="221" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d97706" font-weight="bold" xml:space="preserve">release</text>
<text x="40" y="261" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7c3aed" font-weight="bold" xml:space="preserve">develop</text>
<text x="40" y="301" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" font-weight="bold" xml:space="preserve">feature</text>
