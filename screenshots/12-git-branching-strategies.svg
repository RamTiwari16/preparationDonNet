<text x="240" y="124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold" xml:space="preserve">v1.0.1</text>
<text x="390" y="124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold" xml:space="preserve">v1.1</text>
<text x="40" y="328" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve">dashed = merge back into develop</text>
<rect x="456" y="56" width="420" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="472" y="80" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">Trunk-based development</text>
<text x="472" y="100" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155" xml:space="preserve">one main branch, merge small changes daily</text>
<text x="472" y="181" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="bold" xml:space="preserve">main</text>
<text x="472" y="241" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" font-weight="bold" xml:space="preserve">short</text>
