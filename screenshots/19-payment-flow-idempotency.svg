<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Payment Flow with Idempotency Keys</title>
<desc>A checkout request carries an Idempotency-Key that is checked before the payment state machine calls the gateway, with signed webhooks updating state, a double-entry ledger, and nightly reconciliation.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="595" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">Payment Flow with Idempotency Keys</text>
<rect x="24" y="70" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="94" y="96" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Checkout</text>
<text x="94" y="114" font-size="13" fill="#334155" text-anchor="middle">client app</text>
<line x1="164" y1="100" x2="212" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="188" cy="84" r="11" fill="#2563eb"/>
<text x="188" y="88.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="214" y="62" width="220" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="324" y="84" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Payments API</text>
<text x="324" y="104" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">POST /payments</text>
<text x="324" y="124" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">Idempotency-Key: 7f3c-a1</text>
<line x1="434" y1="100" x2="478" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="456" cy="84" r="11" fill="#2563eb"/>
<text x="456" y="88.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="480" y="62" width="180" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="570" y="84" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">Idempotency store</text>
<text x="570" y="104" font-size="13" fill="#1f2937" text-anchor="middle">key → status + response</text>
<text x="570" y="124" font-size="13" fill="#334155" text-anchor="middle">unique index, TTL 24 h</text>
<line x1="660" y1="86" x2="704" y2="76" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
<line x1="660" y1="114" x2="704" y2="128" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<rect x="706" y="54" width="170" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="791" y="72" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="791" dy="0">Seen key: return the</tspan><tspan x="791" dy="16">stored response</tspan></text>
<rect x="706" y="106" width="170" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="791" y="125" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="791" dy="0">New key: save as</tspan><tspan x="791" dy="16">IN-PROGRESS, go on</tspan></text>
<path d="M94,130 V168 H300 V140" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="40" y="188" font-size="13" fill="#475569" font-style="italic">retry after a timeout reuses the SAME key: same result, no double charge</text>
<rect x="24" y="204" width="432" height="152" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="226" font-size="14" fill="#b45309" font-weight="700">Payment state machine (stored with the key)</text>
<rect x="40" y="244" width="96" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="88.0" y="267" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Created</text>
<rect x="186" y="244" width="104" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="238.0" y="267" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Authorized</text>
<rect x="340" y="244" width="100" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="390.0" y="267" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Captured</text>
<rect x="113" y="308" width="100" height="36" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="163.0" y="331" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">Failed</text>
<rect x="340" y="308" width="100" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="390.0" y="331" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">Refunded</text>
<line x1="136" y1="262" x2="184" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="161" y="239" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">auth OK</text>
<line x1="290" y1="262" x2="338" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="315" y="239" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">capture</text>
<line x1="96" y1="280" x2="140" y2="306" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="40" y="300" font-size="13" fill="#b91c1c">declined</text>
<line x1="226" y1="280" x2="196" y2="306" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="232" y="300" font-size="13" fill="#b91c1c">void / expired</text>
<line x1="390" y1="280" x2="390" y2="306" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrP)"/>
<text x="398" y="297" font-size="13" fill="#6d28d9">refund</text>
<line x1="791" y1="152" x2="791" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="791" cy="178" r="11" fill="#2563eb"/>
<text x="791" y="182.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="768" y="174" font-size="13" fill="#334155" text-anchor="end"><tspan x="768" dy="0">authorize + capture,</tspan><tspan x="768" dy="16">same key passed on</tspan></text>
<rect x="696" y="206" width="180" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="786" y="227" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Payment gateway</text>
<text x="786" y="245" font-size="13" fill="#334155" text-anchor="middle">(Stripe / Adyen)</text>
<line x1="786" y1="256" x2="786" y2="294" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrT)"/>
<circle cx="786" cy="275" r="11" fill="#0f766e"/>
<text x="786" y="279.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="770" y="280" font-size="13" fill="#334155" text-anchor="end">async webhook: payment.captured</text>
<rect x="696" y="296" width="180" height="62" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="786" y="316" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Webhook endpoint</text>
<text x="786" y="334" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="786" dy="0">verify HMAC signature,</tspan><tspan x="786" dy="16">dedupe by event id</tspan></text>
<line x1="696" y1="330" x2="458" y2="330" stroke="#0d9488" stroke-width="2" marker-end="url(#arrT)"/>
<circle cx="680" cy="330" r="11" fill="#0f766e"/>
<text x="680" y="334.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="570" y="322" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">update state</text>
<rect x="24" y="384" width="432" height="156" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="40" y="406" font-size="14" fill="#0f172a" font-weight="700">Ledger (double-entry, append-only)</text>
<rect x="36" y="416" width="408" height="24" rx="4" fill="#f1f5f9"/>
<text x="46" y="433" font-size="13" fill="#475569" font-weight="700">Account</text>
<text x="330" y="433" font-size="13" fill="#475569" text-anchor="end" font-weight="700">Debit</text>
<text x="430" y="433" font-size="13" fill="#475569" text-anchor="end" font-weight="700">Credit</text>
<text x="46" y="460" font-size="13" fill="#1f2937">Gateway receivable</text>
<text x="330" y="460" font-size="13" fill="#1f2937" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve">100.00</text>
<text x="430" y="460" font-size="13" fill="#1f2937" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"></text>
<text x="46" y="482" font-size="13" fill="#1f2937">Sales revenue</text>
<text x="330" y="482" font-size="13" fill="#1f2937" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"></text>
<text x="430" y="482" font-size="13" fill="#1f2937" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve">100.00</text>
<line x1="36" y1="490" x2="444" y2="490" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="510" font-size="13" fill="#334155"><tspan x="46" dy="0">debits always equal credits; a refund posts</tspan><tspan x="46" dy="17">reversing entries, nothing is updated in place</tspan></text>
<path d="M786,358 V420 H460" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrT)"/>
<circle cx="786" cy="390" r="11" fill="#0f766e"/>
<text x="786" y="394.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="620" y="412" font-size="13" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">post entries</text>
<rect x="500" y="448" width="376" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<circle cx="522" cy="470" r="11" fill="#b45309"/>
<text x="522" y="474.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<text x="540" y="475" font-size="14" fill="#b45309" font-weight="700">Nightly reconciliation job</text>
<text x="516" y="498" font-size="13" fill="#1f2937"><tspan x="516" dy="0">compare the ledger with the gateway's</tspan><tspan x="516" dy="16">settlement report; flag missing or</tspan><tspan x="516" dy="16">mismatched payments for review</tspan></text>
<line x1="458" y1="494" x2="498" y2="494" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3" marker-start="url(#arrA)" marker-end="url(#arrA)"/>
<text x="24" y="574" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">store the key with the result before calling out, so any retry replays the answer instead of charging twice.</tspan></text>
</svg>
