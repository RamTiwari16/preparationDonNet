<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>URL Shortener Design</title>
<desc>Write path turns a long URL into a base62 short code from a unique ID and stores it in a database and cache; read path resolves the code through cache then database and redirects with 301 or 302, logging clicks asynchronously.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">URL Shortener Design</text>
<rect x="24" y="52" width="852" height="172" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="76" font-size="15" fill="#1d4ed8" font-weight="700">Write path: shorten a URL</text>
<rect x="40" y="92" width="140" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="110" y="113" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Client</text>
<text x="110" y="133" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">POST /api/urls</text>
<text x="110" y="151" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">{ longUrl }</text>
<line x1="180" y1="136" x2="208" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="195" cy="116" r="11" fill="#2563eb"/>
<text x="195" y="120.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="210" y="92" width="140" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="280" y="113" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Write API</text>
<text x="280" y="133" font-size="13" fill="#1f2937" text-anchor="middle">validate URL,</text>
<text x="280" y="151" font-size="13" fill="#1f2937" text-anchor="middle">block malware</text>
<line x1="350" y1="136" x2="378" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="365" cy="116" r="11" fill="#2563eb"/>
<text x="365" y="120.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="380" y="92" width="140" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450" y="113" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">ID generator</text>
<text x="450" y="133" font-size="13" fill="#1f2937" text-anchor="middle">counter / Snowflake</text>
<text x="450" y="151" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">id = 9326731923</text>
<line x1="520" y1="136" x2="548" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="535" cy="116" r="11" fill="#2563eb"/>
<text x="535" y="120.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="550" y="92" width="140" height="72" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="620" y="113" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Base62 encode</text>
<text x="620" y="133" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">[0-9a-zA-Z]</text>
<text x="620" y="151" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">→ abc123</text>
<line x1="690" y1="136" x2="718" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="705" cy="116" r="11" fill="#2563eb"/>
<text x="705" y="120.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<rect x="720" y="92" width="140" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="790" y="113" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Store</text>
<text x="790" y="133" font-size="13" fill="#1f2937" text-anchor="middle">DB: abc123 → URL</text>
<text x="790" y="151" font-size="13" fill="#1f2937" text-anchor="middle">+ write to cache</text>
<text x="40" y="188" font-size="13" fill="#1f2937">Returns 201 Created: https://sho.rt/abc123.   7 base62 characters = 62^7 ≈ 3.5 trillion codes.</text>
<text x="40" y="208" font-size="13" fill="#334155">Custom alias? Insert it as the primary key; a duplicate-key error means the alias is taken.</text>
<rect x="24" y="238" width="852" height="222" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="40" y="262" font-size="15" fill="#15803d" font-weight="700">Read path: redirect (about 100x more reads than writes)</text>
<rect x="40" y="304" width="130" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="105" y="330" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Browser</text>
<text x="105" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">GET /abc123</text>
<rect x="214" y="304" width="170" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="299" y="330" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Redirect service</text>
<text x="299" y="350" font-size="13" fill="#334155" text-anchor="middle">stateless, scaled out</text>
<line x1="170" y1="320" x2="212" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<circle cx="191" cy="290" r="11" fill="#2563eb"/>
<text x="191" y="294.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<line x1="214" y1="352" x2="172" y2="352" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
<circle cx="193" cy="378" r="11" fill="#15803d"/>
<text x="193" y="382.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<rect x="444" y="282" width="150" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="519" y="303" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Redis cache</text>
<text x="519" y="322" font-size="13" fill="#1f2937" text-anchor="middle">abc123 → URL</text>
<rect x="444" y="384" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="519" y="405" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Database</text>
<text x="519" y="424" font-size="13" fill="#334155" text-anchor="middle">PK lookup</text>
<line x1="384" y1="314" x2="442" y2="304" stroke="#d97706" stroke-width="2" marker-end="url(#arrA)"/>
<circle cx="410" cy="294" r="11" fill="#b45309"/>
<text x="410" y="298.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="410" y="340" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">hit</text>
<line x1="384" y1="356" x2="442" y2="404" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="400" cy="392" r="11" fill="#475569"/>
<text x="400" y="396.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="384" y="397" font-size="13" fill="#334155" text-anchor="end" font-weight="700">miss</text>
<line x1="519" y1="384" x2="519" y2="336" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<circle cx="519" cy="360" r="11" fill="#475569"/>
<text x="519" y="364.6" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="533" y="365" font-size="13" fill="#334155">populate, TTL</text>
<line x1="299" y1="366" x2="299" y2="400" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrP)"/>
<rect x="214" y="402" width="170" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="299" y="423" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">Click queue (Kafka)</text>
<text x="299" y="439" font-size="13" fill="#334155" text-anchor="middle">fire-and-forget</text>
<line x1="214" y1="424" x2="172" y2="424" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrP)"/>
<rect x="40" y="402" width="130" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="105" y="421" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">Click analytics</text>
<text x="105" y="437" font-size="13" fill="#334155" text-anchor="middle">counts, geo, referrer</text>
<rect x="628" y="282" width="232" height="164" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="644" y="304" font-size="14" fill="#0f172a" font-weight="700">Step 5: 301 or 302?</text>
<text x="644" y="326" font-size="13" fill="#15803d" font-weight="700">301 Moved Permanently</text>
<text x="644" y="344" font-size="13" fill="#1f2937"><tspan x="644" dy="0">browser caches it; later clicks</tspan><tspan x="644" dy="17">skip you (less load, no stats)</tspan></text>
<text x="644" y="388" font-size="13" fill="#1d4ed8" font-weight="700">302 Found</text>
<text x="644" y="406" font-size="13" fill="#1f2937"><tspan x="644" dy="0">every click reaches the service:</tspan><tspan x="644" dy="17">analytics, target can change</tspan></text>
<text x="24" y="482" font-size="15" fill="#0f172a" font-weight="700">Key generation options</text>
<rect x="24" y="492" width="276" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="38" y="514" font-size="14" fill="#6d28d9" font-weight="700">Counter + base62</text>
<text x="38" y="536" font-size="13" fill="#1f2937"><tspan x="38" dy="0">unique and short, but sequential</tspan><tspan x="38" dy="17">codes are guessable; give each</tspan><tspan x="38" dy="17">server an ID range (DB ticket).</tspan></text>
<rect x="312" y="492" width="276" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="326" y="514" font-size="14" fill="#0f766e" font-weight="700">Hash + collision check</text>
<text x="326" y="536" font-size="13" fill="#1f2937"><tspan x="326" dy="0">first 7 chars of base62(SHA-256)</tspan><tspan x="326" dy="17">of the URL; same URL, same code;</tspan><tspan x="326" dy="17">on collision add a salt, retry.</tspan></text>
<rect x="600" y="492" width="276" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="614" y="514" font-size="14" fill="#b45309" font-weight="700">Pre-generated key pool</text>
<text x="614" y="536" font-size="13" fill="#1f2937"><tspan x="614" dy="0">a key service makes random unused</tspan><tspan x="614" dy="17">codes offline; servers take a</tspan><tspan x="614" dy="17">batch: no collision check on write.</tspan></text>
<text x="24" y="622" font-size="13" fill="#1f2937"><tspan fill="#475569" font-weight="700" font-style="italic">Interview takeaway: </tspan><tspan fill="#475569" font-style="italic">unique ID + base62 for short codes, cache-first reads, and 302 if you need click analytics.</tspan></text>
</svg>
