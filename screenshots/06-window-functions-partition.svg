<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Window Functions with PARTITION BY</title>
<desc>An Employees table split into per-department windows showing ROW_NUMBER, RANK and DENSE_RANK tie behaviour, LAG and LEAD reading neighbouring rows, and a running-total frame.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="571" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#0f172a">Window Functions with PARTITION BY</text>
<text x="24" y="64" font-size="13" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" xml:space="preserve">every column below: fn() OVER (PARTITION BY Dept ORDER BY Salary DESC)</text>
<text x="24" y="84" font-size="13" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" xml:space="preserve">SUM(Salary) OVER (... ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)</text>
<rect x="24" y="100" width="736" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="50.0" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Dept</text>
<text x="106.0" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Name</text>
<text x="171.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">LEAD</text>
<text x="171.0" y="136" font-size="13" fill="#475569" text-anchor="middle">next row</text>
<text x="273.0" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Salary</text>
<text x="375.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">LAG</text>
<text x="375.0" y="136" font-size="13" fill="#475569" text-anchor="middle">prev row</text>
<text x="458.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">ROW_NUMBER</text>
<text x="458.0" y="136" font-size="13" fill="#475569" text-anchor="middle">1, 2, 3</text>
<text x="538.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">RANK</text>
<text x="538.0" y="136" font-size="13" fill="#475569" text-anchor="middle">1, 1, 3</text>
<text x="620.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">DENSE_RANK</text>
<text x="620.0" y="136" font-size="13" fill="#475569" text-anchor="middle">1, 1, 2</text>
<text x="715.0" y="119" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">SUM</text>
<text x="715.0" y="136" font-size="13" fill="#475569" text-anchor="middle">running</text>
<rect x="24" y="148" width="736" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<line x1="76" y1="178" x2="760" y2="178" stroke="#cbd5e1" stroke-width="1"/>
<line x1="76" y1="208" x2="760" y2="208" stroke="#cbd5e1" stroke-width="1"/>
<line x1="76" y1="238" x2="760" y2="238" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="206.0" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">IT</text>
<text x="50" y="223.0" font-size="13" fill="#475569" text-anchor="middle">window</text>
