<text x="715.0" y="168" font-size="14" fill="#1f2937" text-anchor="middle">9000</text>
<rect x="414" y="182" width="88" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<rect x="510" y="182" width="56" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<rect x="574" y="182" width="92" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
