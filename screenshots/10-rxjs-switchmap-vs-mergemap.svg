<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" role="img">
<title>RxJS Flattening Operators Compared</title>
<desc>Marble diagram comparing switchMap, mergeMap, concatMap and exhaustMap for three source events that each start a 160 ms inner request.</desc>
