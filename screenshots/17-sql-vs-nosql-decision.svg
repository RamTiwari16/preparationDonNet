<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" role="img">
<title>SQL versus NoSQL Decision Guide</title>
<desc>A decision ladder mapping access patterns to relational, document, key-value, wide-column and graph databases with typical use, cost and examples.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="635" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<text x="32" y="40" font-size="20" fill="#0f172a" font-weight="bold">SQL versus NoSQL Decision Guide</text>
<text x="32" y="62" font-size="13.5" fill="#475569">Walk the questions top to bottom; the first honest "yes" picks the store.</text>
<text x="32" y="106" font-size="13" fill="#475569" font-weight="bold">Question</text>
<text x="264" y="106" font-size="13" fill="#475569" font-weight="bold">Pick</text>
<text x="396" y="106" font-size="13" fill="#475569" font-weight="bold">Typical use and cost</text>
<text x="652" y="106" font-size="13" fill="#475569" font-weight="bold">Examples</text>
<line x1="24" y1="114" x2="876" y2="114" stroke="#cbd5e1" stroke-width="1"/>
<rect x="24" y="120" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="124" y="147.68" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="124" dy="0">Need ACID transactions</tspan><tspan x="124" dy="18">and joins across entities?</tspan></text>
<polyline points="224,152 256,152" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="240" y="146" font-size="13" fill="#334155" text-anchor="middle">yes</text>
<rect x="256" y="120" width="120" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="316" y="157.04" font-size="14" fill="#1e3a8a" text-anchor="middle"><tspan x="316" dy="0" font-size="14" font-weight="bold">Relational</tspan></text>
<rect x="384" y="120" width="492" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<line x1="640" y1="128" x2="640" y2="176" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="146" font-size="13" fill="#1f2937"><tspan x="396" dy="0">Orders, payments, inventory</tspan><tspan x="396" dy="21" fill="#475569">Cost: writes scale vertically</tspan></text>
<text x="652" y="146" font-size="13" fill="#1f2937"><tspan x="652" dy="0">SQL Server, PostgreSQL,</tspan><tspan x="652" dy="21">MySQL (EF Core / Dapper)</tspan></text>
<polyline points="124,184 124,204" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="136" y="198" font-size="13" fill="#334155">no</text>
<rect x="24" y="204" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="124" y="231.68" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="124" dy="0">Is each entity a nested,</tspan><tspan x="124" dy="18">evolving JSON document?</tspan></text>
<polyline points="224,236 256,236" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="240" y="230" font-size="13" fill="#334155" text-anchor="middle">yes</text>
<rect x="256" y="204" width="120" height="64" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="316" y="241.04" font-size="14" fill="#134e4a" text-anchor="middle"><tspan x="316" dy="0" font-size="14" font-weight="bold">Document</tspan></text>
<rect x="384" y="204" width="492" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<line x1="640" y1="212" x2="640" y2="260" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="230" font-size="13" fill="#1f2937"><tspan x="396" dy="0">Catalog, profiles, CMS content</tspan><tspan x="396" dy="21" fill="#475569">Cost: joins, duplicated data</tspan></text>
<text x="652" y="230" font-size="13" fill="#1f2937"><tspan x="652" dy="0">MongoDB, Azure Cosmos DB,</tspan><tspan x="652" dy="21">Couchbase</tspan></text>
<polyline points="124,268 124,288" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="136" y="282" font-size="13" fill="#334155">no</text>
<rect x="24" y="288" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="124" y="315.68" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="124" dy="0">Pure lookup by key,</tspan><tspan x="124" dy="18">sub-millisecond latency?</tspan></text>
<polyline points="224,320 256,320" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="240" y="314" font-size="13" fill="#334155" text-anchor="middle">yes</text>
<rect x="256" y="288" width="120" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="316" y="325.04" font-size="14" fill="#78350f" text-anchor="middle"><tspan x="316" dy="0" font-size="14" font-weight="bold">Key-value</tspan></text>
<rect x="384" y="288" width="492" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<line x1="640" y1="296" x2="640" y2="344" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="314" font-size="13" fill="#1f2937"><tspan x="396" dy="0">Cache, sessions, rate limits</tspan><tspan x="396" dy="21" fill="#475569">Cost: no rich queries</tspan></text>
<text x="652" y="314" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Redis, Azure Cache for Redis,</tspan><tspan x="652" dy="21">DynamoDB (as key-value)</tspan></text>
<polyline points="124,352 124,372" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="136" y="366" font-size="13" fill="#334155">no</text>
<rect x="24" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="124" y="399.68" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="124" dy="0">Huge write volume and</tspan><tspan x="124" dy="18">queries known up front?</tspan></text>
<polyline points="224,404 256,404" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="240" y="398" font-size="13" fill="#334155" text-anchor="middle">yes</text>
<rect x="256" y="372" width="120" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="316" y="409.04" font-size="14" fill="#4c1d95" text-anchor="middle"><tspan x="316" dy="0" font-size="14" font-weight="bold">Wide-column</tspan></text>
<rect x="384" y="372" width="492" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="640" y1="380" x2="640" y2="428" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="398" font-size="13" fill="#1f2937"><tspan x="396" dy="0">Time series, IoT, audit logs</tspan><tspan x="396" dy="21" fill="#475569">Cost: no joins, query-first design</tspan></text>
<text x="652" y="398" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Apache Cassandra, ScyllaDB,</tspan><tspan x="652" dy="21">HBase, Bigtable</tspan></text>
<polyline points="124,436 124,456" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="136" y="450" font-size="13" fill="#334155">no</text>
<rect x="24" y="456" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="124" y="483.68" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="124" dy="0">Are the relationships</tspan><tspan x="124" dy="18">themselves the query?</tspan></text>
<polyline points="224,488 256,488" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="240" y="482" font-size="13" fill="#334155" text-anchor="middle">yes</text>
<rect x="256" y="456" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="316" y="493.04" font-size="14" fill="#14532d" text-anchor="middle"><tspan x="316" dy="0" font-size="14" font-weight="bold">Graph</tspan></text>
<rect x="384" y="456" width="492" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<line x1="640" y1="464" x2="640" y2="512" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="482" font-size="13" fill="#1f2937"><tspan x="396" dy="0">Social graph, fraud rings, routes</tspan><tspan x="396" dy="21" fill="#475569">Cost: hard to shard, niche skills</tspan></text>
<text x="652" y="482" font-size="13" fill="#1f2937"><tspan x="652" dy="0">Neo4j, Cosmos DB (Gremlin),</tspan><tspan x="652" dy="21">Amazon Neptune</tspan></text>
<polyline points="124,520 124,544" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="136" y="536" font-size="13" fill="#334155">no</text>
<rect x="24" y="544" width="852" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="450" y="569.04" font-size="14" fill="#1f2937" text-anchor="middle"><tspan x="450" dy="0" font-weight="bold">Default: start relational; add a specialised store only for a measured need (polyglot persistence).</tspan></text>
<text x="32" y="612" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: pick by access pattern and consistency need, not by trend; most systems are SQL plus Redis.</text>
</g>
</svg>
