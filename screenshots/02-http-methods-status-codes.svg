<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" role="img">
<title>HTTP Methods and Status Codes</title>
<desc>Cheat sheet of HTTP methods with safe and idempotent flags, and the most important 2xx, 3xx, 4xx and 5xx status codes in one phrase each.</desc>
<defs>
