<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" role="img">
<title>ASP.NET Core Startup Lifecycle</title>
<desc>The Program.cs startup sequence from CreateBuilder through service registration, Build, middleware, endpoints and Run on Kestrel, plus configuration source precedence.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arrSR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="593" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">ASP.NET Core Startup Lifecycle</text>
<text x="32" y="78" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700">Program.cs (minimal hosting)</text>
<rect x="32" y="92" width="492" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="54" cy="116.0" r="11" fill="#2563eb"/>
<text x="54" y="121.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="76" y="112" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#1e3a8a" font-weight="700">var builder = WebApplication.CreateBuilder(args);</text>
<text x="76" y="131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">loads configuration, logging, DI container, host defaults</text>
<path d="M278.0 140 L278.0 149" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="150" width="492" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="54" cy="174.0" r="11" fill="#2563eb"/>
<text x="54" y="179.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="76" y="170" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#1e3a8a" font-weight="700">builder.Services.AddControllers() / AddDbContext&lt;T&gt;()</text>
<text x="76" y="189" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">register services: lifetimes are decided here</text>
<path d="M278.0 198 L278.0 207" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="208" width="492" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="54" cy="232.0" r="11" fill="#7c3aed"/>
<text x="54" y="237.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="76" y="228" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#4c1d95" font-weight="700">var app = builder.Build();</text>
<text x="76" y="247" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">service provider built: registrations now read-only</text>
<path d="M278.0 256 L278.0 265" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="266" width="492" height="48" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="54" cy="290.0" r="11" fill="#0f766e"/>
<text x="54" y="295.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="76" y="286" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#134e4a" font-weight="700">app.UseExceptionHandler(); app.UseAuthentication(); ...</text>
<text x="76" y="305" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">middleware pipeline, in this exact order</text>
<path d="M278.0 314 L278.0 323" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="324" width="492" height="48" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="54" cy="348.0" r="11" fill="#0f766e"/>
<text x="54" y="353.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="76" y="344" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#134e4a" font-weight="700">app.MapControllers(); app.MapGet("/health", ...);</text>
<text x="76" y="363" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">endpoints: what finally handles a request</text>
<path d="M278.0 372 L278.0 381" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<rect x="32" y="382" width="492" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="54" cy="406.0" r="11" fill="#15803d"/>
<text x="54" y="411.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="76" y="402" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#14532d" font-weight="700">app.Run();</text>
<text x="76" y="421" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">starts Kestrel, listens on ports, blocks until shutdown</text>
<rect x="32" y="440" width="492" height="40" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="278.0" y="465" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#14532d" font-weight="700" text-anchor="middle">Kestrel accepts HTTP requests and feeds them into the pipeline</text>
<path d="M278.0 430 L278.0 439" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrS)"/>
<text x="556" y="78" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700">Configuration sources (last one wins)</text>
<rect x="592" y="92" width="276" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="608" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="700">Command-line arguments</text>
<text x="608" y="131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">--Logging:LogLevel:Default=Debug</text>
<rect x="592" y="150" width="276" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="608" y="170" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="700">Environment variables</text>
<text x="608" y="189" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Logging__LogLevel__Default (double _)</text>
<rect x="592" y="208" width="276" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="608" y="228" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#4c1d95" font-weight="700">User secrets</text>
<text x="608" y="247" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Development only, never in source control</text>
<rect x="592" y="266" width="276" height="48" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="608" y="286" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#134e4a" font-weight="700">appsettings.{Environment}.json</text>
<text x="608" y="305" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">e.g. appsettings.Production.json</text>
<rect x="592" y="324" width="276" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="608" y="344" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1e293b" font-weight="700">appsettings.json</text>
<text x="608" y="363" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">base defaults, committed to the repo</text>
<path d="M570 372 L570 92" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrR)"/>
<text x="592" y="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155"><tspan x="592" dy="0">Higher layer overrides the same key below.</tspan><tspan x="592" dy="18">Read via builder.Configuration["Key"]</tspan><tspan x="592" dy="18">or bind sections with IOptions&lt;T&gt;.</tspan></text>
<rect x="32" y="496" width="836" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="48" y="521" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d">Gotcha: builder.Services.Add...() after Build() throws (collection is read-only); Use/Map order still matters.</text>
<text x="32" y="568" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: register services before Build(), compose middleware after it, and remember config is layered.</text>
</svg>
