<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" role="img">
<title>Event Capturing and Bubbling</title>
<desc>A click travels down the DOM in the capturing phase, fires at the target, then bubbles back up; stopPropagation cuts the trip short.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="587" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold" xml:space="preserve">Event Capturing and Bubbling</text>
<rect x="24" y="56" width="456" height="352" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="80" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1d4ed8" font-weight="bold" xml:space="preserve">&lt;div id="menu"&gt;</text>
<rect x="72" y="112" width="360" height="264" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="88" y="136" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f766e" font-weight="bold" xml:space="preserve">&lt;ul&gt;</text>
<rect x="120" y="168" width="264" height="168" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="136" y="192" font-family="Consolas, Menlo, monospace" font-size="13" fill="#15803d" font-weight="bold" xml:space="preserve">&lt;li&gt;  = event.target</text>
<rect x="178.0" y="204.0" width="148" height="24" rx="12.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="252" y="220.55" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold" xml:space="preserve">user clicks here</text>
<text x="136" y="276" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#991b1b" xml:space="preserve"><tspan x="136" dy="0">li handler calls stopPropagation():</tspan><tspan x="136" dy="18">bubbling stops at the red bar,</tspan><tspan x="136" dy="18">ul and div handlers never run</tspan></text>
<path d="M48,68 V252 H118" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" stroke-linejoin="round"/>
<circle cx="48" cy="104" r="11" fill="#2563eb"/>
<text x="48" y="108.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="48" cy="152" r="11" fill="#2563eb"/>
<text x="48" y="156.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<line x1="384" y1="252" x2="396" y2="252" stroke="#d97706" stroke-width="2.5"/>
<rect x="399" y="236" width="6" height="32" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<path d="M410,252 H456 V68" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-amber)" stroke-linejoin="round"/>
<circle cx="456" cy="152" r="11" fill="#b45309"/>
<text x="456" y="156.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="456" cy="92" r="11" fill="#b45309"/>
<text x="456" y="96.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="360" cy="188" r="11" fill="#15803d"/>
<text x="360" y="192.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<rect x="504" y="56" width="372" height="116" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="524" cy="84" r="11" fill="#2563eb"/>
<text x="524" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="552" cy="84" r="11" fill="#2563eb"/>
<text x="552" y="88.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="574" y="89" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1d4ed8" font-weight="bold" xml:space="preserve">Capturing: window down to target</text>
<text x="520" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" xml:space="preserve"><tspan x="520" dy="0">Order: div (1), then ul (2), then li.</tspan><tspan x="520" dy="20">Only listeners added with</tspan><tspan x="520" dy="20">{ capture: true } run in this phase.</tspan></text>
<rect x="504" y="184" width="372" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="524" cy="212" r="11" fill="#15803d"/>
<text x="524" y="216.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="546" y="217" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#15803d" font-weight="bold" xml:space="preserve">Target phase</text>
<text x="520" y="242" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" xml:space="preserve"><tspan x="520" dy="0">Handlers on the clicked li run here;</tspan><tspan x="520" dy="20">event.target is always this li.</tspan></text>
<rect x="504" y="288" width="372" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<circle cx="524" cy="316" r="11" fill="#b45309"/>
<text x="524" y="320.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="552" cy="316" r="11" fill="#b45309"/>
<text x="552" y="320.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="574" y="321" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#92400e" font-weight="bold" xml:space="preserve">Bubbling: back up (the default)</text>
<text x="520" y="346" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" xml:space="preserve"><tspan x="520" dy="0">Order: ul (4), div (5), then window.</tspan><tspan x="520" dy="20">Default for addEventListener, onclick,</tspan><tspan x="520" dy="20">and (click) / onClick bindings.</tspan></text>
<rect x="24" y="424" width="420" height="124" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="40" y="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#b91c1c" font-weight="bold" xml:space="preserve">stopPropagation() vs preventDefault()</text>
<text x="40" y="474" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="40" dy="0">stopPropagation: event stops travelling on</tspan><tspan x="40" dy="19">(stopImmediatePropagation also skips other</tspan><tspan x="40" dy="19">handlers on the same element).</tspan><tspan x="40" dy="19">preventDefault: cancels the browser default only.</tspan></text>
<rect x="456" y="424" width="420" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472" y="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9" font-weight="bold" xml:space="preserve">Event delegation (uses bubbling)</text>
<text x="472" y="472" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" xml:space="preserve">One parent listener covers every child, even new ones:</text>
<text x="472" y="494" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" xml:space="preserve"><tspan x="472" dy="0">ul.addEventListener('click', e =&gt; {</tspan><tspan x="472" dy="19">  const li = e.target.closest('li');</tspan><tspan x="472" dy="19">});</tspan></text>
<text x="24" y="568" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-style="italic" xml:space="preserve">Interview takeaway: capture down, target, bubble up; delegate on a parent and use stopPropagation sparingly.</text>
</svg>
