<rect x="24" y="500" width="136" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="92" y="525.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="92" dy="0">Database per</tspan><tspan x="92" dy="17">service</tspan></text>
<rect x="300" y="500" width="340" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="314" y="519.68" font-size="13" fill="#1f2937"><tspan x="314" dy="0">1 POST /checkout, 2 read cart</tspan><tspan x="314" dy="18">3 create order (Pending) + outbox row</tspan><tspan x="314" dy="18">4 OrderPlaced, 5 charge card</tspan><tspan x="314" dy="18">6 PaymentCompleted, 7 reserve stock</tspan><tspan x="314" dy="18">8 email sent; order set to Confirmed</tspan><tspan x="314" dy="18" fill="#7f1d1d">Fail: PaymentFailed -&gt; cancel order (saga)</tspan></text>
<polyline points="766,468 766,500" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr_amber)"/>
<circle cx="766" cy="484" r="11" fill="#b45309"/>
<text x="766" y="488.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<rect x="656" y="500" width="220" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="766" y="525.18" font-size="13" fill="#1f2937" text-anchor="middle"><tspan x="766" dy="0" font-weight="bold">Notification service</tspan><tspan x="766" dy="17">email / SMS / push</tspan></text>
<text x="32" y="644" font-size="13.5" fill="#475569" font-style="italic">Interview takeaway: sync for the user request, async events + saga for checkout; outbox keeps DB writes and events consistent.</text>
</g>
